<style>
/* Layout: trail-map workbench. Question panel left, live badge on a sticky easel right; stacks badge-first on phones. */
:root {
  --paper: #EDF1EC;
  --card: #F8FAF6;
  --ink: #17302B;
  --muted: #566A63;
  --pine: #2E5D4F;
  --blaze: #E3A42F;
  --mist: #D6E0DA;
  --line: #C3D0C9;
  --guide: #EAF0F7;
  --guide-line: #5C7FA3;
  --contour: rgba(46, 93, 79, 0.07);
  --display: "Overpass", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111A18; --card: #18231F; --ink: #E4ECE7; --muted: #9DB1A9;
    --pine: #86C0A9; --blaze: #F0B64C; --mist: #22322D; --line: #2F433D;
    --guide: #18222D; --guide-line: #8FB3D6;
    --contour: rgba(134, 192, 169, 0.06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111A18; --card: #18231F; --ink: #E4ECE7; --muted: #9DB1A9;
  --pine: #86C0A9; --blaze: #F0B64C; --mist: #22322D; --line: #2F433D;
  --guide: #18222D; --guide-line: #8FB3D6;
  --contour: rgba(134, 192, 169, 0.06); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background:
    repeating-radial-gradient(circle at 85% 10%, transparent 0 38px, var(--contour) 38px 40px),
    var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
.brand { font-family: var(--display); font-weight: 900; font-size: 1.35rem; letter-spacing: 0.01em; text-transform: uppercase; }
.brand span { color: var(--pine); }
.where { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--display); font-weight: 700; }
.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 6px; }
.progress i { height: 8px; border-radius: 2px; background: var(--mist); }
.progress i.done { background: var(--pine); }
.progress i.now { background: var(--blaze); }
.legs { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; flex-wrap: wrap; gap: 4px 12px; }
.app { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 32px; align-items: start; }
.panel { min-width: 0; }
.easel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.easel canvas { width: 100%; max-width: 360px; height: auto; aspect-ratio: 1; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.14)); }
.easel .cap { font-family: var(--display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.kicker { font-family: var(--display); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pine); }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 3.4vw, 2.4rem); line-height: 1.08; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 26px 0 8px; text-wrap: balance; }
.prompt { max-width: 62ch; color: var(--muted); margin: 0 0 18px; font-size: 1.05rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.opts.three { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.opt {
  font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative;
  background: var(--card); border: 2px solid var(--line); border-radius: 10px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  transition: border-color .15s;
}
.opt:hover { border-color: var(--pine); }
.opt[aria-pressed="true"] { border-color: var(--pine); background: var(--mist); }
.opt.grow[aria-pressed="true"] { border-color: var(--blaze); border-style: dashed; }
.opt canvas { width: 100%; height: auto; aspect-ratio: 1; border-radius: 6px; }
.opt b { font-family: var(--display); font-weight: 800; font-size: 1rem; line-height: 1.2; }
.opt small { color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
.opt .num {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--pine); color: var(--paper); font-family: var(--display); font-weight: 900;
  display: grid; place-items: center; font-size: 0.95rem;
}
:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.chip {
  font-family: var(--display); font-weight: 800; font-size: 0.98rem; letter-spacing: 0.03em;
  padding: 9px 15px; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
.chip[aria-pressed="true"] { border-color: var(--pine); background: var(--pine); color: var(--paper); }
.chip.ai { border-style: dashed; border-color: var(--guide-line); }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 0.92rem; max-width: 560px; margin-top: 8px; }
.field input, .field textarea {
  font: inherit; font-weight: 400; font-size: 1.02rem; padding: 10px 12px; border-radius: 8px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.hint { color: var(--muted); font-size: 0.86rem; font-weight: 400; }
.pledge { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; padding: 14px 16px; border: 2px dashed var(--pine); border-radius: 10px; max-width: 62ch; cursor: pointer; }
.pledge input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--pine); flex: none; }
.pledge strong { font-family: var(--display); font-weight: 800; }
.tip { margin-top: 24px; padding: 12px 16px; border-left: 6px solid var(--blaze); background: var(--card); border-radius: 0 8px 8px 0; max-width: 64ch; }
.tip .lbl { font-family: var(--display); font-weight: 800; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: block; }
.nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.btn {
  font-family: var(--display); font-weight: 800; font-size: 1rem; letter-spacing: 0.03em;
  padding: 12px 22px; border-radius: 8px; cursor: pointer; border: 2px solid var(--pine);
  background: transparent; color: var(--ink);
}
.btn.go { background: var(--pine); color: var(--paper); }
.btn.guide { border-color: var(--guide-line); background: var(--guide); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.slider { display: grid; gap: 6px; margin-bottom: 22px; max-width: 580px; }
.slider .q { font-weight: 700; }
.slider .ends { display: flex; justify-content: space-between; gap: 16px; font-size: 0.88rem; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--pine); height: 28px; }
.mirror { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.mirror > div { min-width: 0; }
.gap { margin-top: 6px; padding: 12px 16px; border-radius: 10px; background: var(--card); border: 2px solid var(--line); max-width: 62ch; }
.gap b { font-family: var(--display); font-weight: 800; }
.guidebox { margin-top: 6px; padding: 16px 18px; border-radius: 12px; background: var(--guide); border: 2px solid var(--guide-line); max-width: 64ch; }
.guidebox .who { font-family: var(--display); font-weight: 800; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--guide-line); display: block; margin-bottom: 4px; }
.guidebox p { margin: 6px 0; }
.guidebox .q { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.3; }
.guidebox .err { color: var(--muted); }
.ainote { font-size: 0.84rem; color: var(--muted); margin: 8px 0 0; max-width: 62ch; }
.upload { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0 4px; }
.upload img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 2px solid var(--line); }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.seg button { font-family: var(--display); font-weight: 800; font-size: 0.95rem; padding: 10px 16px; cursor: pointer; background: var(--card); color: var(--ink); border: 0; border-right: 2px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--pine); color: var(--paper); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 18px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--pine); }
.notes { display: grid; gap: 12px; margin: 8px 0 22px; }
.notes section { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.notes .lbl { display: block; font-family: var(--display); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.notes .head { font-family: var(--display); font-weight: 900; font-size: 1.4rem; line-height: 1.15; text-wrap: balance; }
.notes p { margin: 4px 0 0; }
.key { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 18px; margin: 6px 0 22px; padding: 0; list-style: none; }
.key li { font-size: 0.92rem; }
.key b { font-family: var(--display); font-weight: 800; }
.journal { margin: 6px 0 22px; padding-left: 18px; border-left: 3px solid var(--line); }
.journal p { margin: 0 0 10px; font-style: italic; max-width: 62ch; }
.journal span { display: block; font-style: normal; font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.out { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.out img { width: 220px; max-width: 100%; height: auto; border-radius: 8px; background: repeating-conic-gradient(var(--mist) 0 25%, var(--card) 0 50%) 0 0 / 20px 20px; }
.out p { flex: 1 1 220px; min-width: 0; margin: 0; color: var(--muted); font-size: 0.92rem; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .easel { position: static; order: -1; }
  .easel canvas { max-width: 220px; }
  .opts, .opts.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Trail <span>Badge</span> Builder</div>
    <div class="where">Graphics Center · Leadership Expedition · about 30 minutes</div>
  </header>
  <div class="progress" id="progress" aria-label="Progress"></div>
  <div class="legs"><span>Basecamp</span><span>The climb</span><span>The mirror</span><span>Summit</span></div>
  <div class="app">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="easel">
      <canvas id="badge" width="720" height="720" aria-label="Your badge, building as you answer"></canvas>
      <div class="cap" id="cap">Your badge builds as you answer</div>
    </aside>
  </div>
</div>

<script>
/* ================= data ================= */
const S = 600;
const PAL = {
  easy: { sky:'#CFE8E2', skyLow:'#EEF7F2', far:'#8DBFAE', near:'#3F7B65', accent:'#F0B33C', ink:'#1D3A33', light:'#F8F6EE', water:'#6FB0C0', rock:'#6E7F78' },
  hard: { sky:'#C6CEDA', skyLow:'#E9EDF2', far:'#8A96A8', near:'#3F4A5C', accent:'#D9573B', ink:'#1B2230', light:'#F4F4F2', water:'#5E7D98', rock:'#5A606B' },
  fun:  { sky:'#F9CDAA', skyLow:'#FDEBDA', far:'#E3877A', near:'#6E3B6A', accent:'#FFD45E', ink:'#2B1A33', light:'#FFF8EE', water:'#8C7BC4', rock:'#8A5A7E' },
  dawn: { sky:'#D7D3F0', skyLow:'#F3F0FB', far:'#9C93C9', near:'#3E3A6B', accent:'#F2A65A', ink:'#1F1C3A', light:'#FAF8FF', water:'#7FA3D6', rock:'#6D6890' },
  mono: { sky:'#FFFFFF', skyLow:'#FFFFFF', far:'#C9C9C9', near:'#6A6A6A', accent:'#8A8A8A', ink:'#111111', light:'#FFFFFF', water:'#A8A8A8', rock:'#4A4A4A' }
};

const GEAR = [
  { v:'map', label:'Trail map', skill:'Planning ahead' },
  { v:'rope', label:'Climbing rope', skill:'Connecting people' },
  { v:'lantern', label:'Lantern', skill:'Explaining clearly' },
  { v:'compass', label:'Compass', skill:'Keeping the vision' },
  { v:'firstaid', label:'First-aid kit', skill:'Noticing when people struggle' },
  { v:'trailmix', label:'Trail mix', skill:'Keeping energy up' },
  { v:'whistle', label:'Whistle', skill:'Speaking up' },
  { v:'notebook', label:'Field notebook', skill:'Learning from mistakes' },
  { v:'multitool', label:'Multi-tool', skill:'Solving problems on the spot' }
];
const TERRAIN = [
  { v:'mountains', label:'Leading a team', sub:'Mountain range: big goals, steep climbs' },
  { v:'desert', label:'A new role', sub:'Canyon country: unfamiliar ground' },
  { v:'water', label:'A heavy semester', sub:'Rapids: a lot moving at once' },
  { v:'forest', label:'A group project', sub:'Forest: finding the way together' }
];
const SLIDERS = [
  { q:'When a project starts, I would rather…', a:'Map it out first', b:'Figure it out as we go' },
  { q:'On the trail, I usually walk…', a:'At the front, setting pace', b:'At the back, watching the group' },
  { q:'When the group disagrees, I…', a:'Make a call and move', b:'Wait until everyone is in' },
  { q:'After a long climb, I recharge…', a:'Alone at the summit', b:'Around the campfire' }
];
const SCENES = [
  { v:'summit', label:'The lone summit', see:'peak', pal:'hard' },
  { v:'campfire', label:'The campfire circle', see:'flame', pal:'fun' },
  { v:'river', label:'The river bend', see:'wave', pal:'easy' },
  { v:'crossroads', label:'The crossroads', see:'arrow', pal:'dawn' }
];
const STORM = [
  { v:'rope', label:'Walk with whoever is struggling', skill:'Inclusion' },
  { v:'dots', label:'Split the gear so no one carries too much', skill:'Delegation' },
  { v:'double', label:'Climb up and re-check the map', skill:'Perspective' },
  { v:'trail', label:'Rally the group with energy', skill:'Motivation' }
];
const WORDS = ['Steady','Bold','Funny','Organized','Patient','Direct','Creative','Calm','Driven','Supportive','Curious','Honest'];
const SYMBOLS = [
  { v:'compass', label:'Compass', sub:'I set direction' },
  { v:'rope', label:'Rope', sub:'I connect people' },
  { v:'lantern', label:'Lantern', sub:'I bring clarity' },
  { v:'flag', label:'Flag', sub:'I go first' }
];
const MOTTOS = ["THERE'S ALWAYS ANOTHER PEAK", 'GO DOWN TO GO UP', 'LEAVE NO ONE BEHIND', 'CLIMB HIGH TO SEE CLEARLY', 'TAKE THE FUN PATH'];

const STEPS = [
  { leg:'Basecamp', kicker:'Step 1 of 10 · Trailhead', title:'Before we start: set your intention',
    prompt:'This expedition is about how you lead: your habits, strengths and growth edges. It is not about your private life.',
    tip:'Read the pledge out loud together. Point out that the AI steps run on their own Claude account, and that only their answers about leadership get shared, never names or personal stories.' },
  { leg:'Basecamp', kicker:'Step 2 of 10 · Pack your bag', title:'What do you always carry, and what are you still learning to carry?',
    prompt:'Pick the three pieces of gear you never leave behind. Then pick one you are still learning to carry. Be honest: nobody packs everything.',
    tip:'Ask: which one was hardest to leave out? The growth item usually starts the best conversation.' },
  { leg:'Basecamp', kicker:'Step 3 of 10 · The terrain', title:'What ground are you crossing right now?',
    prompt:'Pick the challenge closest to what is in front of you this semester. Then put into words what makes it hard.',
    tip:'If they get stuck writing, ask: what part of this would you rather someone else handle? That is usually the hard part.' },
  { leg:'The climb', kicker:'Step 4 of 10 · How you move', title:'Where do you actually land?',
    prompt:'There is no right side. Drag each slider to where you really are, not where you think a leader should be.',
    tip:'Ask: which slider would your closest friend move? Which way, and why?' },
  { leg:'The climb', kicker:'Step 5 of 10 · Which one feels like you?', title:'Pick the scene that feels most like you right now',
    prompt:'Go with your gut. Then look closer: what did you notice first in the one you picked?',
    tip:'Before they type, ask them to say out loud what they noticed. People see completely different things in the same picture.' },
  { leg:'The climb', kicker:'Step 6 of 10 · The storm', title:'A storm rolls in and the group is exhausted',
    prompt:'Put these in the order you would actually do them, not the order you think is best. Tap them 1 to 4.',
    tip:'Ask: what does your first move say about what you protect when things get hard?' },
  { leg:'The mirror', kicker:'Step 7 of 10 · The mirror', title:'How do you see yourself, and how does your team see you?',
    prompt:'Pick three words for each. If you are not sure how your team sees you, guess. The gap between the two is the interesting part.',
    tip:'If there is no overlap, do not fix it. Ask: what might your team be seeing that you are not?' },
  { leg:'The mirror', kicker:'Step 8 of 10 · The Trail Guide', title:'The Trail Guide has a question for you',
    prompt:'Claude reads your answers so far and asks you one question no one else would get. Answer it in your own words.',
    tip:'This is the AI literacy moment. Ask: did the question feel accurate? Where did it miss? The student decides what is true, not the AI.' },
  { leg:'Summit', kicker:'Step 9 of 10 · Sketch station', title:'Sketch your symbol, then make it a badge',
    prompt:'Grab paper and take two minutes to sketch a simple symbol for how you lead. Stick figures count. Then choose the badge symbol and your trail lesson.',
    tip:'Make sure only the sketch is in the photo: no faces, IDs or anything with a name on it. Ask: what did the Trail Guide notice that you did not intend?' },
  { leg:'Summit', kicker:'Step 10 of 10 · Summit', title:'Your field notes and your badge',
    prompt:'Here is what your expedition revealed. Read it, decide what fits, then make your badge.',
    tip:'Ask them to read one line of their field notes out loud and say whether it is true. Then open Adobe Express on their own ESU account and print together.' }
];

/* ================= state ================= */
const fresh = () => ({
  step: 0, pledge: false, word: '', pack: [], growth: null, terrain: null, hard: '',
  sliders: [50, 50, 50, 50], moved: [false, false, false, false], scene: null, notice: '',
  storm: [], selfWords: [], teamWords: [], guide: null, guideAnswer: '',
  sketchFeedback: null, aiMottos: [], style: null, motto: '', notes: null,
  format: 'button', mono: false
});
const state = fresh();
let sketchFile = null, sketchURL = null;
let SAMPLE;            // undefined = still checking, null = unavailable, fn = available
let IMAGES_OK = false;
let busy = null;       // AbortController for the call in progress

/* ================= drawing ================= */
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function star(c, x, y, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    const px = x + rr * Math.cos(a), py = y + rr * Math.sin(a);
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}
function drawSky(c, p) {
  const g = c.createLinearGradient(0, 80, 0, 360);
  g.addColorStop(0, p.sky); g.addColorStop(1, p.skyLow);
  c.fillStyle = g; c.fillRect(0, 0, S, S);
}
function drawTerrain(c, p, t) {
  if (!t) { c.fillStyle = p.far; c.fillRect(0, 430, S, 170); return; }
  if (t === 'mountains') {
    c.fillStyle = p.far; poly(c, [0,380, 90,290, 160,340, 250,250, 330,330, 420,265, 520,340, 600,300, 600,600, 0,600]); c.fill();
    c.fillStyle = p.light; c.globalAlpha = 0.85;
    poly(c, [250,250, 270,270, 255,275, 240,262]); c.fill();
    poly(c, [420,265, 440,284, 425,288, 408,278]); c.fill();
    c.globalAlpha = 1;
    c.fillStyle = p.near; poly(c, [0,455, 120,375, 200,425, 300,345, 400,430, 500,385, 600,445, 600,600, 0,600]); c.fill();

function canNext() {
  switch (state.step) {
    case 0: return state.pledge && state.word.trim().length > 0;
    case 1: return state.pack.length === 3 && !!state.growth;
    case 2: return !!state.terrain;
    case 3: return state.moved.every(Boolean);
    case 4: return !!state.scene;
    case 5: return state.storm.length === 4;
    case 6: return state.selfWords.length === 3 && state.teamWords.length === 3;
    case 7: return !!state.guide && words(state.guideAnswer) >= 3;
    case 8: return !!state.style && !!state.motto;
    default: return true;
  }

  if (!ov.length && state.selfWords.length) observation = `You see yourself as ${state.selfWords.join(', ').toLowerCase()}, but you guessed your team sees ${state.teamWords.join(', ').toLowerCase()}. None of those overlap.`;
  else if (g && state.storm[0] === 'rope' && state.growth === 'whistle') observation = 'In a storm your first move is to stay with whoever is struggling, and speaking up is the gear you are still learning to carry.';

    : g ? `When was the last time you needed ${g.skill.toLowerCase()} and reached for something else instead?`

function show(focusSel) {
  const s = STEPS[state.step];
  panel.innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h1>${s.title}</h1>
    <p class="prompt">${s.prompt}</p>
    ${BODIES[state.step]()}
    <div class="tip"><span class="lbl">CSA prompt</span>${s.tip}</div>
    <div class="nav">
      ${state.step > 0 ? '<button type="button" class="btn" id="back">Back</button>' : ''}
      ${state.step < 9 ? `<button type="button" class="btn go" id="next" ${canNext() ? '' : 'disabled'}>${state.step === 8 ? 'Reach the summit' : 'Next'}</button>`
        : '<button type="button" class="btn go" id="restart">Start a new expedition</button>'}
    </div>`;
  panel.querySelectorAll('canvas[data-tthumb]').forEach(cv => render(cv, { ...badgeState(), terrain: cv.dataset.tthumb, word: '', motto: '' }));
  panel.querySelectorAll('canvas[data-scene-img]').forEach(cv => drawScene(cv, cv.dataset.sceneImg));
  panel.querySelectorAll('canvas[data-sym]').forEach(cv => render(cv, { ...badgeState(), style: cv.dataset.sym, motto: '' }));
  bind();
  drawProgress();
  refreshBadge();
  if (state.step === 9) makeOutput();
  if (focusSel) document.querySelector(focusSel)?.focus();
}
function updateNext() { const n = document.getElementById('next'); if (n) n.disabled = !canNext(); }

/* ================= events ================= */
function bind() {
  const $ = id => document.getElementById(id);
  panel.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const g = b.dataset.group, v = b.dataset.v;
    if (g === 'word') { state.word = v; const i = $('own-word'); if (i) i.value = ''; }
    if (g === 'motto') { state.motto = v; const i = $('own-motto'); if (i) i.value = ''; }
    if (g === 'word' || g === 'motto') {
      panel.querySelectorAll(`.chip[data-group="${g}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
      refreshBadge(); updateNext(); return;
    }
    const list = g === 'self' ? state.selfWords : state.teamWords;
    const i = list.indexOf(v);
    if (i >= 0) list.splice(i, 1); else if (list.length < 3) list.push(v);
    show(`.chip[data-group="${g}"][data-v="${v}"]`);
  }));
  $('own-word')?.addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z\s'-]/g, '');
    state.word = e.target.value.trim();
    panel.querySelectorAll('.chip[data-group="word"]').forEach(x => x.setAttribute('aria-pressed', false));
    refreshBadge(); updateNext();
  });
  $('pledge')?.addEventListener('change', e => { state.pledge = e.target.checked; updateNext(); });
  panel.querySelectorAll('[data-pack]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.pack, i = state.pack.indexOf(v);
    if (i >= 0) state.pack.splice(i, 1); else if (state.pack.length < 3) state.pack.push(v);
    show(`[data-pack="${v}"]`);
  }));
  panel.querySelectorAll('[data-growth]').forEach(b => b.addEventListener('click', () => { state.growth = b.dataset.growth; show(`[data-growth="${state.growth}"]`); }));
  panel.querySelectorAll('[data-terrain]').forEach(b => b.addEventListener('click', () => {
    state.terrain = b.dataset.terrain;
    panel.querySelectorAll('[data-terrain]').forEach(x => x.setAttribute('aria-pressed', x === b));
    refreshBadge(); updateNext();
  }));
  $('hard')?.addEventListener('input', e => { state.hard = e.target.value; });
  panel.querySelectorAll('[data-slider]').forEach(r => r.addEventListener('input', () => {
    const i = +r.dataset.slider;
    state.sliders[i] = +r.value; state.moved[i] = true;
    r.setAttribute('aria-valuetext', sliderRead(i));
    refreshBadge(); updateNext();
  }));
  panel.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => {
    state.scene = b.dataset.scene;
    panel.querySelectorAll('[data-scene]').forEach(x => x.setAttribute('aria-pressed', x === b));
    refreshBadge(); updateNext();
  }));
  $('notice')?.addEventListener('input', e => { state.notice = e.target.value; });
  panel.querySelectorAll('[data-storm]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.storm, i = state.storm.indexOf(v);
    if (i >= 0) state.storm.splice(i); else state.storm.push(v);
    show(`[data-storm="${v}"]`);
  }));
  $('storm-clear')?.addEventListener('click', () => { state.storm = []; show(); });
  $('ask-guide')?.addEventListener('click', askGuide);
  $('guide-ans')?.addEventListener('input', e => { state.guideAnswer = e.target.value; updateNext(); });
  $('sketch')?.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    sketchFile = f;
    if (sketchURL) URL.revokeObjectURL(sketchURL);
    sketchURL = URL.createObjectURL(f);
    state.sketchFeedback = null;
    show('#ask-sketch');
  });
  $('ask-sketch')?.addEventListener('click', askSketch);
  panel.querySelectorAll('[data-style]').forEach(b => b.addEventListener('click', () => {
    state.style = b.dataset.style;
    panel.querySelectorAll('[data-style]').forEach(x => x.setAttribute('aria-pressed', x === b));
    refreshBadge(); updateNext();
  }));
  $('own-motto')?.addEventListener('input', e => {
    state.motto = e.target.value.toUpperCase().trim();
    panel.querySelectorAll('.chip[data-group="motto"]').forEach(x => x.setAttribute('aria-pressed', false));
    refreshBadge(); updateNext();
  });
  $('ask-notes')?.addEventListener('click', askNotes);
  panel.querySelectorAll('[data-fmt]').forEach(b => b.addEventListener('click', () => { state.format = b.dataset.fmt; show(`#fmt-${state.format}`); }));
  $('mono')?.addEventListener('change', e => { state.mono = e.target.checked; refreshBadge(); makeOutput(); });
  $('next')?.addEventListener('click', () => { if (!canNext()) return; busy?.abort(); state.step++; show(); panel.scrollIntoView({ block: 'start' }); });
  $('back')?.addEventListener('click', () => { busy?.abort(); state.step--; show(); });
  $('restart')?.addEventListener('click', () => {
    busy?.abort();
    Object.assign(state, fresh());
    sketchFile = null; if (sketchURL) URL.revokeObjectURL(sketchURL); sketchURL = null;
    show(); panel.scrollIntoView({ block: 'start' });
  });
}

/* ================= Claude calls ================= */
async function askGuide() {
  const area = document.getElementById('guide-area');
  const err = document.getElementById('guide-err');
  if (!SAMPLE) { state.guide = offlineGuide(); show('#guide-ans'); return; }
  area.innerHTML = `<div class="guidebox"><span class="who">Trail Guide · Claude</span><p>Reading your trail notes… this can take up to a minute.</p></div>`;
  try {
    const r = await askJSON(`${RULES}\n\nTask: Notice ONE real pattern or tension across these answers (for example, between what they carry and how they act in the storm, or between how they see themselves and how they think their team sees them). Then ask ONE open question that helps them think deeper about how they lead. Do not ask about anything private.\n\nReply with only JSON: {"observation": "one sentence, at most 30 words, phrased tentatively (\\"It looks like…\\")", "question": "one open question, at most 25 words"}\n\nTHEIR ANSWERS:\n${profile()}`, { cache: false });
    if (!r || typeof r.question !== 'string') throw { code: 'upstream_error' };
    state.guide = { observation: String(r.observation || ''), question: r.question };
    show('#guide-ans');
  } catch (e) {
    if (e && e.code === 'cancelled') return;
    state.guide = offlineGuide();
    show('#guide-ans');
    const el = document.getElementById('guide-err'); if (el) el.textContent = errCopy(e);
  }
}
async function askSketch() {
  const area = document.getElementById('sketch-area');
  const btn = document.getElementById('ask-sketch');
  if (!SAMPLE) return;
  btn.disabled = true;
  area.innerHTML = `<div class="guidebox"><span class="who">Trail Guide · Claude</span><p>${sketchFile ? 'Looking at your sketch…' : 'Reading your answers…'}</p></div>`;
  const withImg = !!(sketchFile && IMAGES_OK);
  try {
    const r = await askJSON(`${RULES}\n\nTask: ${withImg ? 'The attached photo shows only a quick hand sketch the student drew of a symbol for how they lead. Describe what you see kindly, give one concrete tip to make it read clearly at small size on a round 2-inch badge, and say which of these badge symbols is closest in spirit: compass, rope, lantern, flag.' : 'Suggest trail lessons for their badge.'} Also write 3 short mottos for the bottom of their badge, drawn from their own answers and in trail or climbing language. Each motto must be UPPERCASE and at most 24 characters including spaces.\n\nReply with only JSON: {${withImg ? '"see": "one sentence", "feedback": "one or two sentences", "symbol": "compass|rope|lantern|flag", ' : ''}"mottos": ["...", "...", "..."]}\n\nTHEIR ANSWERS:\n${profile()}`, withImg ? { images: [sketchFile], cache: false } : { cache: false });
    const mottos = Array.isArray(r && r.mottos) ? r.mottos.map(m => String(m).toUpperCase().slice(0, 26)).filter(Boolean).slice(0, 3) : [];
    state.aiMottos = mottos;
    state.sketchFeedback = withImg ? { see: String(r.see || ''), feedback: String(r.feedback || ''), symbol: ['compass', 'rope', 'lantern', 'flag'].includes(r.symbol) ? r.symbol : '' } : null;
    show('.chip.ai');
  } catch (e) {
    if (e && e.code === 'cancelled') return;
    area.innerHTML = '';
    btn.disabled = false;
    const el = document.getElementById('sketch-err'); if (el) el.textContent = errCopy(e);
  }
}
async function askNotes() {
  const area = document.getElementById('notes-area');
  if (!SAMPLE) { state.notes = offlineNotes(); show(); return; }
  area.innerHTML = `<div class="guidebox"><span class="who">Trail Guide · Claude</span><p>Writing your field notes… this can take up to a minute.</p></div>`;
  const sym = SYMBOLS.find(s => s.v === state.style);
  try {
    const r = await askJSON(`${RULES}\n\nTask: Write this student's field notes from their leadership expedition. Speak to them as "you". Quote or echo their own words where it helps. Be honest: a growth edge should be real, not flattery.\n\nReply with only JSON: {"headline": "a title for them, at most 8 words", "strength": "2 sentences on what they carry as a leader", "growth": "2 sentences on where they are growing", "watch": "1 sentence: a blind spot to watch for, phrased kindly", "try": "1 specific thing to try this week in a club, class project or campus job"}\n\nTHEIR ANSWERS:\n${profile()}\nBadge symbol: ${sym ? sym.label + ' (' + sym.sub + ')' : '-'}\nTrail lesson: ${state.motto}`, { cache: false });
    if (!r || typeof r.strength !== 'string') throw { code: 'upstream_error' };
    state.notes = { headline: String(r.headline || ''), strength: r.strength, growth: String(r.growth || ''), watch: String(r.watch || ''), try: String(r.try || '') };
    show();
  } catch (e) {
    if (e && e.code === 'cancelled') return;
    state.notes = offlineNotes();
    show();
    const el = document.getElementById('notes-err'); if (el) el.textContent = errCopy(e);
  }
}

function makeOutput() {
  const img = document.getElementById('outimg');
  if (!img) return;
  const cv = document.createElement('canvas');
  cv.width = cv.height = 1500;
  render(cv, badgeState(), { final: true, mirror: state.format === 'shirt' });
  try { img.src = cv.toDataURL('image/png'); } catch (e) { img.alt = 'Image could not be generated. Take a screenshot of the badge instead.'; }
}

/* ================= boot ================= */
show();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('900 44px Overpass'), document.fonts.load('800 25px Overpass')]).then(() => refreshBadge()).catch(() => {});
}
(async () => {
  try {
    SAMPLE = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (SAMPLE) {
      const lim = await SAMPLE.limits().catch(() => null);
      IMAGES_OK = !!(lim && lim.images);
    }
  } catch (e) { SAMPLE = null; }
  if (state.step >= 7) show();
})();
</script>
