<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Know Me, Know You Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: kiosk split — question card on the left, the live friendship badge on the right; stacks on phones */
:root{
  --bg:#EEF3FF; --dot:#D9E3FA; --surface:#FFFFFF; --ink:#1B1E2E; --muted:#56607E;
  --edge:#1B1E2E; --accent:#2357C7; --on-accent:#FFFFFF; --sun:#FFC72C; --on-sun:#1B1E2E;
  --chip:#F4F7FF; --track:#D3DCF2; --good:#1E9E5A; --miss:#C8102E;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11152A; --dot:#1A2040; --surface:#1A2038; --ink:#EEF3FF; --muted:#AEB8D6;
  --edge:#05070F; --accent:#5B8CFF; --on-accent:#FFFFFF; --sun:#FFD25A; --on-sun:#1B1E2E;
  --chip:#232B4A; --track:#2E3860; --good:#4CD38A; --miss:#FF6B7F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11152A; --dot:#1A2040; --surface:#1A2038; --ink:#EEF3FF; --muted:#AEB8D6;
  --edge:#05070F; --accent:#5B8CFF; --on-accent:#FFFFFF; --sun:#FFD25A; --on-sun:#1B1E2E;
  --chip:#232B4A; --track:#2E3860; --good:#4CD38A; --miss:#FF6B7F; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 2.5px, transparent 2.6px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.restart{font:700 14px var(--body);background:transparent;color:var(--muted);border:2px solid var(--track);border-radius:999px;padding:8px 16px;cursor:pointer}
.restart.armed{border-color:var(--accent);color:var(--accent)}
.progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.leg{display:flex;flex-direction:column;gap:6px;min-width:0}
.leg b{font:700 12px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.leg.on b{color:var(--ink)}
.bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.leg.on .bar i{background:var(--sun);box-shadow:inset 0 0 0 2px var(--edge)}

.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:start}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);
  padding:30px 30px 26px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel.enter{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.kicker{font:800 13px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.12;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sub{margin:0;color:var(--muted);font-size:17px;max-width:60ch}
p{margin:0;max-width:62ch}
.lbl{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge);display:inline-block;flex:none}

/* answer widgets */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:14px 16px;cursor:pointer;min-width:0;
  transition:transform .08s, box-shadow .08s, background .15s}
.ans:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.ans[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.ans .em{font-size:30px;line-height:1;flex:none}
.ans b{font-weight:800;font-size:18px;line-height:1.25}
.duo .ans{flex-direction:column;justify-content:center;text-align:center;padding:22px 14px;min-height:150px}
.duo .ans .em{font-size:52px}
.duo .ans b{font-size:21px;font-family:var(--display);font-weight:600}
.or{display:none}
.scale{display:flex;flex-direction:column;gap:8px}
.scale .pts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pt{display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer;min-width:0}
.pt i{width:52px;height:52px;border-radius:50%;border:3px solid var(--edge);background:var(--surface);box-shadow:0 4px 0 var(--edge);display:block;transition:transform .08s}
.pt[aria-pressed="true"] i{background:var(--sun)}
.pt:active i{transform:translateY(3px)}
.pt span{font-weight:800;font-size:13.5px;line-height:1.2;text-align:center}
.scale .ends{display:flex;justify-content:space-between;font:800 12px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.guess-row{display:flex;flex-direction:column;gap:10px;padding:14px;border:2px dashed var(--track);border-radius:20px}

/* pass screen */
.pass{align-items:flex-start}
.who{display:inline-block;padding:0 .25em;border:3px solid var(--edge);border-radius:.3em;box-shadow:4px 4px 0 var(--edge);transform:rotate(-2deg)}
.peek{display:flex;align-items:center;gap:12px;background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:12px 16px;font-weight:700}
.peek .em{font-size:30px}

/* intro */
.count{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.count .ans{flex-direction:column;align-items:center;text-align:center;padding:18px 12px}
.count .ans .ppl{display:flex;gap:4px}
.count .ans .ppl i{width:26px;height:26px;border-radius:50%;border:3px solid var(--edge);display:block}
.count .ans small{font-size:14px;opacity:.85}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.field input{font:700 20px var(--display);color:var(--ink);background:var(--chip);border:3px solid var(--edge);border-radius:16px;padding:10px 16px;width:100%;max-width:440px}
.field input:focus{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}

/* design */
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;padding:0;box-shadow:0 3px 0 var(--edge)}
.sw[aria-pressed="true"]{outline:4px solid var(--sun);outline-offset:2px}
.syms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sym{display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--edge);padding:6px 4px;cursor:pointer;min-width:0}
.sym[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.sym img{width:100%;max-width:56px;aspect-ratio:1;display:block}
.sym span{font-weight:800;font-size:12.5px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:12px 14px;cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;min-width:0}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.opt .t{display:flex;flex-direction:column;min-width:0}
.opt .t b{font-weight:800;font-size:17px;line-height:1.25}
.opt .t span{font-size:14px;opacity:.8;line-height:1.35}
.opt img{width:46px;height:46px;flex:none}
.friend-block{display:flex;flex-direction:column;gap:10px}

/* reveal */
.tier{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pct{font:700 64px var(--display);line-height:1;background:var(--sun);color:var(--on-sun);border:3px solid var(--edge);border-radius:24px;box-shadow:0 6px 0 var(--edge);padding:10px 18px;transform:rotate(-3deg)}
.scores{display:flex;flex-direction:column;gap:10px}
.score{display:grid;grid-template-columns:minmax(0,1fr) 140px 54px;gap:12px;align-items:center;font-weight:800}
.score .bar{height:16px;border-radius:8px;border:2px solid var(--edge)}
.score em{font-style:normal;text-align:right;font-family:var(--display);font-weight:600;font-size:20px}
.rv{display:flex;flex-direction:column;gap:10px}
.rq{background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rq > b{font-family:var(--display);font-weight:600;font-size:18px}
.rl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15.5px}
.said{font-weight:800}
.g{font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px;border:2px solid var(--edge);background:var(--surface)}
.g.hit{background:var(--good);color:#fff}
.g.close{background:var(--sun);color:var(--on-sun)}
.g.miss{background:var(--surface);color:var(--ink);text-decoration:none}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.btn{font:700 18px var(--display);letter-spacing:.3px;border:3px solid var(--edge);border-radius:999px;padding:12px 26px;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--edge);transition:transform .08s, box-shadow .08s;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--accent);color:var(--on-accent);margin-left:auto}
.btn.sm{font-size:15px;padding:8px 18px;box-shadow:0 4px 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--edge)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.note{background:var(--chip);border:2px dashed var(--track);border-radius:16px;padding:12px 16px;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:700 16px var(--body);color:var(--ink);background:var(--chip);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.credit{font-size:13px;color:var(--muted)}

.easel{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{width:100%;max-width:520px;aspect-ratio:1;position:relative}
.stage.tall{aspect-ratio:2/3;max-width:400px}
.stage canvas,.stage img{width:100%;height:100%;display:block;object-fit:contain}
.minis{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 12px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mini canvas{width:120px;height:120px}
.cap{font:700 15px var(--body);color:var(--muted);text-align:center;max-width:44ch}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .easel{position:static;order:-1}
  .stage{max-width:280px}
  .stage.tall{max-width:240px}
  .mini canvas{width:90px;height:90px}
  .panel{padding:22px 18px 20px}
}
@media (max-width:560px){
  .four,.opts{grid-template-columns:minmax(0,1fr)}
  .duo .ans{min-height:120px}
  .progress{grid-template-columns:minmax(0,1fr);gap:8px}
  .syms{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pt i{width:44px;height:44px}
  .score{grid-template-columns:minmax(0,1fr) 90px 48px}
  .pct{font-size:48px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="../" class="gc-home" aria-label="Back to all badges">&larr; All badges</a>
<style>.gc-home{position:fixed;left:16px;bottom:16px;z-index:50;font:700 15px system-ui,sans-serif;color:#141414;background:#FFC72C;border:3px solid #141414;border-radius:999px;padding:9px 16px;box-shadow:3px 3px 0 #141414;text-decoration:none}.gc-home:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #141414}@media print{.gc-home{display:none}}</style>
<div class="wrap">
  <header class="top">
    <div class="brand">Know Me, <span>Know You</span><small>Graphics Center · A badge for friends</small></div>
    <button type="button" class="restart" id="restart">Start over</button>
  </header>
  <div class="progress" aria-label="Progress">
    <div class="leg" id="leg1"><b>Round 1 · About me</b><div class="bar"><i id="bar1"></i></div></div>
    <div class="leg" id="leg2"><b>Round 2 · Guess</b><div class="bar"><i id="bar2"></i></div></div>
    <div class="leg" id="leg3"><b>Part 3 · Make the badge</b><div class="bar"><i id="bar3"></i></div></div>
  </div>
  <div class="app">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="easel">
      <div class="stage" id="stage">
        <canvas id="badge" width="1080" height="1080" aria-label="Your friendship badge, one piece for each friend"></canvas>
        <img id="outimg" alt="" hidden>
      </div>
      <div class="minis" id="minis" hidden></div>
      <div class="cap" id="cap"></div>
    </aside>
  </div>
</div>

<script>
/* =============================== DATA =============================== */
const INK = '#1B1E2E', TAU = Math.PI * 2, LW = 5;
const COLORS = [['Cobalt', '#2357C7'], ['Bubblegum', '#FF7AB6'], ['Sunshine', '#FFC72C'], ['Lime', '#9BD13A'], ['Teal', '#00A3AD'],
  ['Tangerine', '#FF8A2B'], ['Cherry', '#D7263D'], ['Grape', '#7B4DFF'], ['Mint', '#5FD3B0'], ['Midnight', '#24315E']];
const SYMS = { star: 'Star', bolt: 'Bolt', moon: 'Moon', sun: 'Sun', flower: 'Flower', note: 'Music', sparkle: 'Sparkle', smile: 'Smile', flame: 'Flame', cloud: 'Cloud' };
const SHAPES = { heart: ['Heart', 'The classic BFF split'], star: ['Star', 'A point for every friend'], circle: ['Circle', 'Clean and simple'] };
const PATS = { dots: ['Polka dots', ''], stripes: ['Stripes', ''], checks: ['Checkers', ''], confetti: ['Confetti', ''], plain: ['Plain', 'Just your color'] };

/* Questions: light and public-safe. One wording works for "you" and for guessing a friend. */
const QS = [
  { t: 'pick', k: '2 a.m. snack', h: 'Go-to 2 a.m. snack?', o: [['🍟', 'Chips'], ['🍫', 'Something sweet'], ['🍜', 'Instant noodles'], ['🍕', 'Leftover pizza']] },
  { t: 'wyr', k: 'Friday night', h: 'Perfect Friday night?', o: [['🎉', 'Out with a crowd'], ['🛋️', 'In with a movie']] },
  { t: 'scale', k: '“On my way” means', h: 'Texts “on my way.” Where are they really?', o: ['Still in bed', 'Getting dressed', 'Halfway there', 'Around the corner', 'Already parked'] },
  { t: 'pick', k: 'Group chat role', h: 'Role in the group chat?', o: [['😂', 'Meme sender'], ['📅', 'The planner'], ['🎙️', 'Voice-note sender'], ['👻', 'Leaves everyone on read']] },
  { t: 'wyr', k: 'Beach or mountains', h: 'Beach day or mountain trail?', o: [['🏖️', 'Beach day'], ['⛰️', 'Mountain trail']] },
  { t: 'pick', k: 'Superpower', h: 'Pick a superpower.', o: [['🕊️', 'Fly'], ['💨', 'Turn invisible'], ['🌀', 'Teleport'], ['🧠', 'Read minds']] },
  { t: 'scale', k: 'Room right now', h: 'How clean is their room right now?', o: ['Spotless', 'Pretty neat', 'Lived-in', 'Messy', 'Floor-drobe'] },
  { t: 'pick', k: 'Go-to drink', h: 'Go-to drink?', o: [['🧊', 'Iced coffee'], ['🍵', 'Tea'], ['⚡', 'Energy drink'], ['💧', 'Just water']] },
  { t: 'wyr', k: 'Text or call', h: 'Text or call?', o: [['💬', 'Text me'], ['📞', 'Just call']] },
  { t: 'pick', k: 'Karaoke move', h: 'Karaoke move?', o: [['🎤', 'Belt the ballad'], ['🔥', 'Take the rap verse'], ['🙌', 'Hype person'], ['🍿', 'Hide by the snacks']] }
];
const SELF_H = { 2: 'Where are you, really, when you text “on my way”?', 6: 'How clean is your room right now?' };
const NQ = QS.length;
const TIERS = [[.85, 'Ride or Die', 'Basically mind readers. Nothing gets past you.'],
  [.65, 'Day Ones', 'You know each other for real, with a few surprises left.'],
  [.4, 'Good Company', 'A solid start, plus some new things you just learned.'],
  [0, 'New Mutuals', 'Lots still to learn, and that’s the fun part.']];
const DESIGN = [
  { k: 'colors', h: 'Each friend picks a color', sub: 'Your color fills your piece and your own button.' },
  { k: 'symbols', h: 'Each friend picks a symbol', sub: 'It sits on your piece, so everyone knows which one is yours.' },
  { k: 'shape', h: 'What shape do your pieces make?', sub: 'Put your buttons side by side and the edges fit together.' },
  { k: 'pattern', h: 'Pick a background pattern', sub: 'Each button gets it in that friend’s color.' },
  { k: 'words', h: 'What goes on the ring?', sub: 'Your names go on top. This goes on the bottom. Keep it something you’d wear in public.' }
];
const DEF_COL = [0, 1, 2], DEF_SYM = ['star', 'bolt', 'moon'];

let st, FLOW, pos = 0;
function fresh(n = 2) {
  return { n, names: ['', '', ''], self: [0, 1, 2].map(() => Array(NQ).fill(null)), guess: {}, col: DEF_COL.slice(), sym: DEF_SYM.slice(),
    shape: 'heart', pat: 'dots', phrase: 'tier', year: '', custom: '', format: 'button', shirt: 'color', mono: false, mirror: false, seed: (Math.random() * 1e9) | 0 };
}
const others = p => [...Array(st.n).keys()].filter(t => t !== p);
const gk = (g, t) => g + '>' + t;
function buildFlow() {
  const F = ['intro', 'names'];
  for (let p = 0; p < st.n; p++) { F.push({ t: 'pass', r: 'self', p }); for (let i = 0; i < NQ; i++) F.push({ t: 'self', p, i }); }
  for (let p = 0; p < st.n; p++) {
    others(p).forEach(t => { if (!st.guess[gk(p, t)]) st.guess[gk(p, t)] = Array(NQ).fill(null); });
    F.push({ t: 'pass', r: 'guess', p }); for (let i = 0; i < NQ; i++) F.push({ t: 'guess', p, i });
  }
  F.push('reveal'); DESIGN.forEach((_, i) => F.push({ t: 'design', i })); F.push('finish');
  FLOW = F;
}
const idxOf = x => FLOW.indexOf(x);
const name = p => (st.names[p] || '').trim() || `Friend ${p + 1}`;
const colOf = p => COLORS[st.col[p]][1];

/* =============================== SCORING =============================== */
function match(i, a, b) { if (a == null || b == null) return 0; if (a === b) return 1; return QS[i].t === 'scale' && Math.abs(a - b) === 1 ? .5 : 0; }
function known(g, t) { const G = st.guess[gk(g, t)] || []; return QS.reduce((s, _, i) => s + match(i, st.self[t][i], G[i]), 0); }
function pairs() { const P = []; for (let g = 0; g < st.n; g++) others(g).forEach(t => P.push([g, t])); return P; }
function overall() { const P = pairs(); return P.reduce((s, [g, t]) => s + known(g, t), 0) / (P.length * NQ); }
function tier() { const o = overall(); return TIERS.find(t => o >= t[0]); }

    <p class="sub">Separate pieces, one shape. Put your buttons side by side and the edges fit together.</p>
    <h2>Make it</h2>
    <div class="chips" role="group" aria-label="What are you making?">${FMTS.map(([k, l]) => `<button type="button" class="chip" data-a="fmt" data-v="${k}" aria-pressed="${st.format === k}">${l}</button>`).join('')}</div>
    ${st.format === 'shirt' ? `<div class="chips" role="group" aria-label="Shirt method">${[['color', 'Full color (printable iron-on)'], ['vinyl', 'One color (vinyl cut)']].map(([k, l]) => `<button type="button" class="chip" data-a="shirt" data-v="${k}" aria-pressed="${st.shirt === k}">${l}</button>`).join('')}</div>
      ${st.shirt === 'color' ? `<label class="toggle"><input type="checkbox" id="mirror" ${st.mirror ? 'checked' : ''}> Mirror the picture</label>` : '<p class="hint">Leave this picture unmirrored. Design Space mirrors it for you when you turn on Mirror.</p>'}`
      : `<label class="toggle"><input type="checkbox" id="mono" ${st.mono ? 'checked' : ''}> Black and white (saves color ink)</label>`}
    ${tips[st.format]}
    <div><a class="btn go" id="dl" href="#" download="know-me-know-you.png">Download picture</a></div>
    <div class="note"><b>To save:</b> tap <b>Download picture</b>, or right-click the picture and choose <b>Save image as</b>. Then print or upload the saved file.</div>
    <p class="credit">Questions and art made for the ESU Graphics Center. Nothing you typed is saved or sent anywhere.</p>
    <div class="nav"><button type="button" class="btn" data-a="back">Back</button><button type="button" class="btn go" data-a="again">Play again</button></div>`;
}
function makeOut() {
  const m = document.getElementById('mono'); if (m) m.onchange = () => { st.mono = m.checked; makeOut(); };
  const mi = document.getElementById('mirror'); if (mi) mi.onchange = () => { st.mirror = mi.checked; makeOut(); };
  minisEl.hidden = true;
  const run = () => {
    const out = compose(st.format), url = out.toDataURL('image/png');
    outimg.src = url;
    outimg.alt = `${joinNames()}’s Know Me, Know You ${st.format === 'card' ? 'profile card' : st.format}, ready to print`;
    stage.classList.toggle('tall', st.format === 'card');
    outimg.hidden = false; cv.hidden = true;
    outimg.style.background = st.format === 'shirt' ? 'repeating-conic-gradient(var(--chip) 0 25%, var(--surface) 0 50%) 0 0/24px 24px' : 'transparent';
    const dl = document.getElementById('dl');
    if (dl) { dl.href = url; dl.download = `know-me-know-you-${st.format}.png`; }
  };
  document.fonts && document.fonts.ready ? document.fonts.ready.then(run) : run();
}

st = fresh(2); buildFlow();
render();
document.fonts && document.fonts.ready.then(() => { if (FLOW[pos] !== 'finish') paint(); });
</script>
</body>
