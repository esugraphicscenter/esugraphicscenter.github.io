<title>Heart Language Badge</title>

<style>
/* Layout: kiosk split — question card on the left, the heart jar / live badge on the right; stacks on phones */
:root{
  --bg:#FFEFF3; --dot:#FFDCE6; --surface:#FFFFFF; --ink:#2A1B33; --muted:#6E5A78;
  --edge:#2A1B33; --accent:#E8336A; --on-accent:#FFFFFF; --sun:#FFC83D; --on-sun:#2A1B33;
  --mint:#1FA486; --chip:#FFF6F9; --track:#F2CAD7;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1326; --dot:#2A1C36; --surface:#2B1E39; --ink:#FFF1F6; --muted:#CBB6D4;
  --edge:#0B060F; --accent:#FF5C8A; --on-accent:#FFFFFF; --sun:#FFD25E; --on-sun:#2A1B33;
  --mint:#3FCBA8; --chip:#382748; --track:#4B365B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1D1326; --dot:#2A1C36; --surface:#2B1E39; --ink:#FFF1F6; --muted:#CBB6D4;
  --edge:#0B060F; --accent:#FF5C8A; --on-accent:#FFFFFF; --sun:#FFD25E; --on-sun:#2A1B33;
  --mint:#3FCBA8; --chip:#382748; --track:#4B365B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 2.5px, transparent 2.6px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.restart{font:700 14px var(--body);background:transparent;color:var(--muted);border:2px solid var(--track);border-radius:999px;padding:8px 16px;cursor:pointer}
.restart.armed{border-color:var(--accent);color:var(--accent)}
.progress{display:grid;grid-template-columns:10fr 6fr;gap:18px}
.leg{display:flex;flex-direction:column;gap:6px;min-width:0}
.leg b{font:700 12px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.leg.on b{color:var(--ink)}
.pips{display:grid;gap:5px}
.pip{height:12px;border-radius:6px;background:var(--track);transition:background .25s}
.pip.done{background:var(--accent)}
.pip.now{background:var(--sun);box-shadow:0 0 0 2px var(--edge)}

.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:start}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);
  padding:30px 30px 26px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel.enter{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.kicker{font:800 13px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.12;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sub{margin:0;color:var(--muted);font-size:17px;max-width:60ch}
p{margin:0;max-width:62ch}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:14px 16px;cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;min-width:0}
.opt:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);
  background:var(--chip);color:var(--ink);border:2px solid var(--edge)}
.opt[aria-pressed="true"] .k{background:var(--edge);color:var(--sun)}
.opt .t{display:flex;flex-direction:column;min-width:0}
.opt .t b{font-weight:800;font-size:18px;line-height:1.25}
.opt .t span{font-size:14.5px;opacity:.8;line-height:1.35}
.sw{flex:none;display:flex;gap:4px}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);display:block}

.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
.opt.big{min-height:150px;justify-content:center;text-align:center}
.opt.big .t{align-items:center}
.opt.big .t b{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2}
.or{align-self:center;font:700 20px var(--display);background:var(--accent);color:var(--on-accent);border:3px solid var(--edge);border-radius:50%;width:56px;height:56px;display:grid;place-items:center}
.rounds{display:flex;align-items:center;gap:8px}
.rd{width:36px;height:36px;border-radius:50%;border:2px solid var(--edge);background:var(--chip);color:var(--ink);font:700 15px var(--display);cursor:pointer}
.rd.got{background:var(--mint);color:#fff}
.rd.cur{box-shadow:0 0 0 3px var(--sun)}

.opts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt.pic{flex-direction:column;align-items:stretch;padding:10px;gap:8px}
.opt.pic img{width:100%;height:auto;border-radius:12px;border:2px solid var(--edge);display:block}
.opt.pic .t{align-items:center;text-align:center}
.opt.pic .t b{font-size:15.5px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:700 16px var(--body);color:var(--ink);background:var(--chip);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.field input{font:700 22px var(--display);color:var(--ink);background:var(--chip);border:3px solid var(--edge);border-radius:16px;padding:12px 16px;width:100%;max-width:420px}
.field input:focus{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.btn{font:700 18px var(--display);letter-spacing:.3px;border:3px solid var(--edge);border-radius:999px;padding:12px 26px;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--edge);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--accent);color:var(--on-accent);margin-left:auto}
.btn.big{font-size:22px;padding:16px 36px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--edge)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.sliders{display:flex;flex-direction:column;gap:22px}
.sl{display:flex;flex-direction:column;gap:6px}
.sl .q{font:600 19px var(--display)}
.sl .ends{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:15.5px}
.sl .ends span:last-child{text-align:right}
.sl input{width:100%;accent-color:var(--accent);height:30px;cursor:pointer}
.read{font:600 15px var(--display);color:var(--accent);text-align:center}

.rates{display:flex;flex-direction:column;gap:12px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:10px 14px}
.rate b{font-weight:800;font-size:16px;line-height:1.3}
.hs{display:flex;gap:2px}
.hb{width:40px;height:40px;border:0;background:transparent;cursor:pointer;padding:2px;border-radius:10px}
.hb svg{width:100%;height:100%;display:block}
.hb path{fill:var(--track);stroke:var(--edge);stroke-width:2.4}
.hb.on path{fill:var(--accent)}

.rank{display:flex;flex-direction:column;gap:10px}
.rank .opt{padding:12px 16px}
.rank .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--display);border:2px dashed var(--track);color:var(--muted)}
.rank .opt[aria-pressed="true"] .num{border:2px solid var(--edge);background:var(--edge);color:var(--sun)}

.chat{display:flex;flex-direction:column;gap:10px;background:var(--chip);border:2px solid var(--edge);border-radius:20px;padding:16px}
.bub{align-self:flex-start;max-width:80%;background:var(--surface);border:2px solid var(--edge);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:700}
.bub small{display:block;font:800 11px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-radius:18px 18px 4px 18px}
.flip{font:600 18px var(--display);padding-top:12px;border-top:3px dashed var(--track)}

.sentence{font:600 clamp(21px,2.4vw,28px)/1.45 var(--display);background:var(--chip);border:3px solid var(--edge);border-radius:20px;padding:14px 18px}
.gap{color:var(--muted)}
.fill{background:var(--sun);color:var(--on-sun);border-radius:10px;padding:0 8px}
.then{display:flex;flex-direction:column;gap:12px}

.left{font:600 20px var(--display)}
.left b{font-size:34px;color:var(--accent);font-variant-numeric:tabular-nums}
.alloc{display:flex;flex-direction:column;gap:14px}
.al{display:grid;grid-template-columns:150px 42px minmax(0,1fr) 42px 26px;gap:10px;align-items:center}
.nm{font-weight:800;line-height:1.25}
.pm{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);background:var(--surface);color:var(--ink);font:700 22px var(--display);cursor:pointer;box-shadow:0 3px 0 var(--edge);line-height:1}
.pm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pm:disabled{opacity:.35;cursor:default}
.pdots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.pdots i{height:18px;border-radius:5px;background:var(--track)}
.pdots i.on{background:var(--accent)}
.al em{font-style:normal;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

.mix{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 46px;gap:10px;align-items:center;font-weight:800;font-size:15px}
.bar .tr{height:16px;border-radius:8px;background:var(--track);overflow:hidden;border:2px solid var(--edge)}
.bar .fl{height:100%}
.bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar.top{font-size:16.5px}
.note{background:var(--chip);border:2px dashed var(--track);border-radius:16px;padding:12px 16px;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:12px 16px;min-width:0}
.card span{display:block;font:800 11.5px var(--body);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card ul{margin:0;padding-left:18px;font-weight:700;font-size:15.5px;line-height:1.4;display:flex;flex-direction:column;gap:4px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.credit{font-size:13px;color:var(--muted)}

.easel{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{width:100%;max-width:520px;aspect-ratio:1;position:relative}
.stage.tall{aspect-ratio:2/3;max-width:400px}
.stage canvas,.stage img{width:100%;height:100%;display:block;object-fit:contain}
.cap{font:700 15px var(--body);color:var(--muted);text-align:center;max-width:42ch}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.lg{display:flex;align-items:center;gap:6px;font:700 13.5px var(--body);background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:4px 10px 4px 6px}
.lg i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .easel{position:static;order:-1}
  .stage{max-width:300px}
  .stage.tall{max-width:260px}
  .panel{padding:22px 18px 20px}
}
@media (max-width:560px){
  .opts,.cols{grid-template-columns:minmax(0,1fr)}
  .opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duo{grid-template-columns:minmax(0,1fr)} .or{justify-self:center}
  .al{grid-template-columns:92px 38px minmax(0,1fr) 38px 22px;gap:6px}
  .pm{width:38px;height:38px}
  .bar{grid-template-columns:110px minmax(0,1fr) 42px;font-size:14px}
  .rate{grid-template-columns:minmax(0,1fr)}
  .hb{width:36px;height:36px}
  .progress{grid-template-columns:minmax(0,1fr);gap:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Heart <span>Language</span><small>Graphics Center · Fill your heart jar</small></div>

<script>
/* =============================== DATA =============================== */
const INK = '#2A1B33';
const LANGS = ['words', 'time', 'acts', 'gifts', 'touch'];
const LANG = {
  words: { n: 'Words of Affirmation', s: 'Kind words', col: '#FF4F79', tint: '#FFE1E9',
    blurb: 'Kind words land with you. A specific “I noticed what you did” can carry you for days.',
    love: ['Tell me what you appreciate, and be specific', 'Send the text, even if it feels small', 'Say it out loud: “I’m proud of you”'],
    show: ['You hype people up and mean it', 'You notice effort and name it', 'You know what someone needs to hear'],
    watch: 'Harsh words can hit you harder than most. Tell people what you need instead of waiting for them to guess.',
    phrases: ['PROUD OF YOU', 'YOU GOT THIS', 'SAY IT OUT LOUD', 'KIND WORDS ONLY'] },
  time: { n: 'Quality Time', s: 'Time together', col: '#7A5CFA', tint: '#E8E1FF',
    blurb: 'Undivided attention is how you feel it. Phones away, eyes up, and you know you matter.',
    love: ['Put the phone down when we talk', 'Make plans and keep them', 'Keep small rituals: a walk, a meal, a weekly call'],
    show: ['You make time even when you’re busy', 'You listen all the way to the end', 'You turn hangouts into memories'],
    watch: 'Canceled plans can feel personal. A busy week is not the same as not caring.',
    phrases: ['PHONES DOWN', 'HERE FOR YOU', 'ALL EARS', 'LET’S HANG OUT'] },
  acts: { n: 'Acts of Service', s: 'Helping out', col: '#1FA486', tint: '#D9F5EC',
    blurb: 'Actions say it best for you. When someone lightens your load, you feel seen.',
    love: ['Help without being asked', 'Follow through on what you said you’d do', 'Take one task off my plate on a hard day'],
    show: ['You jump in when something needs doing', 'People can count on you', 'You notice what would make life easier'],
    watch: 'You might help until you burn out, or quietly keep score. Let people help you too.',
    phrases: ['I GOT YOU', 'HAPPY TO HELP', 'ON IT', 'SHOW, DON’T TELL'] },
  gifts: { n: 'Thoughtful Gifts', s: 'Little surprises', col: '#F2A20C', tint: '#FFF0CC',
    blurb: 'It’s never about the price. A small gift is proof someone was thinking about you.',
    love: ['Bring back something small that made you think of me', 'Remember the little things I like', 'Mark the moments that matter'],
    show: ['You remember details people forget', 'You turn small things into big moments', 'You make people feel thought of'],
    watch: 'A forgotten birthday can sting more than people realize. Say what matters to you so they know.',
    phrases: ['THOUGHT OF YOU', 'JUST BECAUSE', 'LITTLE THINGS', 'SAVED YOU ONE'] },
  touch: { n: 'Physical Touch', s: 'Hugs & high-fives', col: '#FF7A33', tint: '#FFE5D6',
    blurb: 'Closeness helps you feel safe and connected: a hug, a high-five, sitting side by side.',
    love: ['Ask first, then go for the hug', 'High-fives and fist bumps count', 'Sit close when we hang out'],
    show: ['You make people feel welcome right away', 'Your hugs are famous', 'You bring warmth into a room'],
    watch: 'Not everyone shares your comfort zone. Ask first, and take a “no” in stride.',
    phrases: ['HUGS WELCOME', 'HIGH FIVE', 'BRING IT IN', 'ASK, THEN HUG'] }
};

const Q1 = [
  { t: 'wyr', k: 'Would you rather', h: 'Would you rather…', sub: 'Three quick rounds. Go with your gut.', rounds: [
    [['Get a long text listing why a friend appreciates you', 'words'], ['Have your favorite snack show up at your door', 'gifts']],
    [['Have a friend help you move into your room', 'acts'], ['Have a friend stay up talking with you until 2 a.m.', 'time']],
    [['Get a big hug after a rough day', 'touch'], ['Get a handwritten card after a rough day', 'words']]] },
  { t: 'pics', k: 'Picture this', h: 'Which one feels most like being cared for?', sub: 'Pick the picture that hits you first.', opts: [
    ['words', 'A note that says “You got this!”'], ['time', 'A whole afternoon, just the two of you'], ['acts', 'Your to-do list, done for you'],
    ['gifts', 'A small wrapped surprise'], ['touch', 'A hug that lasts a few seconds longer']] },
  { t: 'slider', k: 'Spectrum', h: 'Where do you land?', sub: 'Slide each one. The middle means “both.”', rows: [
    ['When I’m stressed, I want someone to…', ['Talk me through it', 'words'], ['Take something off my plate', 'acts']],
    ['My ideal birthday is…', ['A thoughtful present', 'gifts'], ['A whole day together', 'time']],
    ['When a close friend heads home, I want…', ['A long hug goodbye', 'touch'], ['A plan for next time', 'time']]] },
  { t: 'rate', k: 'Rate it', h: 'How loved would you feel?', sub: 'Give each one 1 to 5 hearts.', items: [
    ['Your roommate does your dishes without being asked', 'acts'], ['A friend says, “I’m proud of you”', 'words'],
    ['Someone saves you a seat and puts their phone away', 'time'], ['A friend brings back a souvenir that made them think of you', 'gifts'],
    ['A friend throws an arm around you at the game', 'touch']] },
  { t: 'rank', k: 'Rank it', h: 'It’s your best friend’s birthday. What do you do first?', sub: 'Tap all five in order, first to last.', items: [
    ['Plan a day with just the two of you', 'time'], ['Write a long card about why they matter', 'words'],
    ['Hunt down the perfect gift', 'gifts'], ['Handle their chores so they can relax', 'acts'], ['Show up at midnight with a big bear hug', 'touch']] },
  { t: 'pick', k: 'Care package', h: 'A friend had a rough week. Pack three things for them.', sub: 'Pick exactly three.', items: [
    ['A note about what you love about them', 'words'], ['Your whole evening, phone off', 'time'], ['A coupon: “I’ll do your laundry”', 'acts'],
    ['Their favorite snacks', 'gifts'], ['A cozy blanket and a long hug', 'touch']] },

    cap.textContent = 'Your jar fills up as you answer.';
  } else if (f === 'reveal') {
    const lang = st.picked, L = LANG[lang], { order } = counts(), alt = order[0] === lang ? order[1] : order[0];
    if (pourStart != null) {
      panel.innerHTML = `<div class="kicker">Sealing your jar</div><h1>Here it comes…</h1><p class="sub">Your jar is full. Let’s see which color shines brightest.</p>
        <div class="nav"><button type="button" class="btn" data-a="skip">Skip</button></div>`;
      cap.textContent = 'Watch the jar.';
    } else {
      panel.innerHTML = `<div class="kicker">Your Heart Language</div>
        <h1 style="color:${L.col === '#F2A20C' ? '#C27F00' : L.col}">${L.n}</h1>
        <p class="sub">${L.blurb}</p>
        <h2>Your heart mix</h2>
        ${mixBars(lang)}
        <div class="note"><b>Most people care about all five.</b> Your mix says more about you than one label. Use it to start a conversation, not to box anyone in.</div>
        <div><button type="button" class="chip" data-a="swap">Feels more like ${esc(LANG[alt].n)}? Switch to it</button></div>
        ${navHTML('Design my badge')}`;
      cap.textContent = 'This is your starting badge. You’ll design it next.';
    }
  } else if (f === 'finish') {
    panel.innerHTML = finishHTML();
    makeOut();
  } else if (f.p === 1) {
    const q = Q1[f.i];
    panel.innerHTML = `<div class="kicker">${q.k} · ${f.i + 1} of ${Q1.length}</div><h1>${esc(q.h)}</h1>${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ''}${q1Body(f.i)}${navHTML(f.i === Q1.length - 1 ? 'Seal my jar' : 'Next')}`;
    syncHearts(performance.now());
    capJar();
    wireQ1(f.i);
  } else {
    const q = Q2[f.i];
    panel.innerHTML = `<div class="kicker">Design · ${f.i + 1} of ${Q2.length}</div><h1>${esc(q.h)}</h1>${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ''}${q2Body(f.i)}${navHTML(f.i === Q2.length - 1 ? 'Finish my badge' : 'Next')}`;
    cap.textContent = 'Point at an option to preview it on your badge.';
    wireQ2();
  }
}
function capJar() { const n = allTokens().length; cap.textContent = n ? `${n} heart${n > 1 ? 's' : ''} in your jar` : 'Your jar is empty. Answer to drop in hearts.'; }

/* ---------- interactions ---------- */
let restartArmed = null;
document.getElementById('restart').onclick = e => {
  const b = e.currentTarget;
  if (restartArmed) { clearTimeout(restartArmed); restartArmed = null; b.classList.remove('armed'); b.textContent = 'Start over'; st = fresh(); hearts = []; pos = 0; pourStart = null; render(); return; }
  b.classList.add('armed'); b.textContent = 'Tap again to start over';
  restartArmed = setTimeout(() => { restartArmed = null; b.classList.remove('armed'); b.textContent = 'Start over'; }, 3000);
};
function go(d) {
  const f = FLOW[pos];
  if (d > 0 && f !== 'intro' && f !== 'finish' && f.p === 1 && f.i === Q1.length - 1) { st.picked = counts().order[0]; pourStart = reduce ? null : performance.now(); }
  else pourStart = null;
  pos = Math.max(0, Math.min(FLOW.length - 1, pos + d));
  ui = { r: 0 };
  const nf = FLOW[pos];
  if (typeof nf === 'object' && nf.p === 1 && Q1[nf.i].t === 'wyr') { const fn = st.a1[nf.i].findIndex(x => x == null); ui.r = fn < 0 ? Q1[nf.i].rounds.length - 1 : fn; }
  render();
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
let advT;
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const act = b.dataset.a, v = b.dataset.v, f = FLOW[pos];
  if (act === 'next') { if (canNext()) go(f === 'finish' ? 0 : 1); return; }
  if (act === 'back') { go(-1); return; }
  if (act === 'skip') { pourStart = null; render(); return; }
  if (act === 'swap') { const { order } = counts(); st.picked = order[0] === st.picked ? order[1] : order[0]; render(); return; }
  if (act === 'again') { st = fresh(); hearts = []; pos = 0; render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'fmt') { st.format = v; panel.innerHTML = finishHTML(); makeOut(); return; }
  if (act === 'shirt') { st.shirt = v; panel.innerHTML = finishHTML(); makeOut(); return; }
  if (act === 'q2') { const k = b.dataset.k; st[k] = v; hover = null; renderQ2Keep(k + v); return; }
  if (typeof f !== 'object' || f.p !== 1) return;
  const q = Q1[f.i], a = st.a1[f.i];
  const re = (focusSel) => { const y = window.scrollY; rerenderQ1(f.i, focusSel); window.scrollTo(0, y); };
  if (act === 'round') { ui.r = +v; re(`[data-a="round"][data-v="${v}"]`); return; }
  if (act === 'wyr') {
    a[ui.r] = +v; re(`[data-a="wyr"][data-v="${v}"]`);
    clearTimeout(advT);
    const nextR = a.findIndex(x => x == null);
    if (nextR >= 0) advT = setTimeout(() => { ui.r = nextR; re('[data-a="wyr"][data-v="0"]'); }, 380);
    return;
  }
  if (act === 'set') { st.a1[f.i] = +v; re(`[data-a="set"][data-v="${v}"]`); return; }
  if (act === 'rate') { a[+b.dataset.k] = +v; re(`[data-a="rate"][data-k="${b.dataset.k}"][data-v="${v}"]`); return; }
  if (act === 'rank') { const k = +v, n = a.indexOf(k); if (n >= 0) a.splice(n); else a.push(k); re(`[data-a="rank"][data-v="${v}"]`); return; }
  if (act === 'rankreset') { a.length = 0; re('[data-a="rank"]'); return; }
  if (act === 'pick') { const k = +v, n = a.indexOf(k); if (n >= 0) a.splice(n, 1); else if (a.length < 3) a.push(k); re(`[data-a="pick"][data-v="${v}"]`); return; }
  if (act === 'chat') { a[+b.dataset.r] = +v; re(`[data-a="chat"][data-r="${b.dataset.r}"][data-v="${v}"]`); return; }
  if (act === 'blank') { a[b.dataset.r] = +v; re(`[data-a="blank"][data-r="${b.dataset.r}"][data-v="${v}"]`); return; }
  if (act === 'alloc') { const k = +b.dataset.k, left = 10 - a.reduce((x, y) => x + y, 0); if (+v > 0 && left > 0) a[k]++; if (+v < 0 && a[k] > 0) a[k]--; re(`[data-a="alloc"][data-k="${k}"][data-v="${v}"]`); return; }
});
function rerenderQ1(i, focusSel) {
  const q = Q1[i];
  panel.innerHTML = `<div class="kicker">${q.k} · ${i + 1} of ${Q1.length}</div><h1>${esc(q.h)}</h1>${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ''}${q1Body(i)}${navHTML(i === Q1.length - 1 ? 'Seal my jar' : 'Next')}`;
  syncHearts(performance.now()); capJar(); wireQ1(i);
  const el = focusSel && panel.querySelector(focusSel); if (el) el.focus({ preventScroll: true });
}
function wireQ1(i) {
  const q = Q1[i];
  if (q.t !== 'slider') return;
  panel.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
    const r = +inp.dataset.r, a = st.a1[i]; a.v[r] = +inp.value; a.t[r] = true;
    document.getElementById('rd-' + r).textContent = readout(q.rows[r], a.v[r]);
    syncHearts(performance.now()); capJar(); refreshNext();
  }));
}
function renderQ2Keep(key) {
  const f = FLOW[pos], q = Q2[f.i];
  panel.innerHTML = `<div class="kicker">Design · ${f.i + 1} of ${Q2.length}</div><h1>${esc(q.h)}</h1>${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ''}${q2Body(f.i)}${navHTML(f.i === Q2.length - 1 ? 'Finish my badge' : 'Next')}`;
  wireQ2();
  const el = [...panel.querySelectorAll('[data-a="q2"]')].find(b => b.dataset.k + b.dataset.v === key);
  if (st.phrase === 'custom' && key === 'phrasecustom') document.getElementById('custom')?.focus(); else el?.focus({ preventScroll: true });
}
function wireQ2() {
  panel.querySelectorAll('[data-a="q2"]').forEach(b => {
    b.addEventListener('pointerenter', () => { hover = { k: b.dataset.k, v: b.dataset.v }; });
    b.addEventListener('pointerleave', () => { hover = null; });
  });
  const nm = document.getElementById('name'); if (nm) { nm.addEventListener('input', () => { st.name = nm.value; refreshNext(); }); nm.addEventListener('keydown', e => { if (e.key === 'Enter' && canNext()) go(1); }); }
  const cu = document.getElementById('custom'); if (cu) cu.addEventListener('input', () => { st.custom = cu.value; refreshNext(); });
}

/* ---------- finish ---------- */
const FMTS = [['button', 'Button'], ['sticker', 'Sticker'], ['keychain', 'Keychain'], ['shirt', 'Shirt (Cricut)'], ['card', 'Profile card']];
function finishHTML() {
  const L = LANG[st.picked], nm = st.name.trim();
  const tips = {
    button: '<p>The colored ring wraps around the edge of the button.</p>',
    sticker: '<p>Print on sticker paper and cut along the dotted line.</p>',
    keychain: '<p>Print, laminate, and cut along the dotted line. Punch the small circle at the top for the ring.</p>',
    card: '<p>A 4 × 6 profile card with your badge, your heart mix, and how to love you. Print it on cardstock.</p>',
    shirt: st.shirt === 'vinyl'
      ? `<ol class="steps"><li>Save the picture, then upload it to Cricut Design Space. Choose <b>Simple</b> and keep it as one layer.</li><li>Size it about 8–10 in wide for the front, or 3.5 in for a chest logo.</li><li>Load heat transfer vinyl shiny side down. Turn on <b>Mirror</b> on the mat screen before you cut.</li><li>Weed out the extra vinyl and press it using your vinyl’s heat guide.</li></ol>`
      : `<ol class="steps"><li>Save the picture, then upload it to Cricut Design Space as a <b>Print Then Cut</b> image.</li><li>Keep it within about 6.75 × 9.25 in (the Print Then Cut limit).</li><li>Print on printable heat transfer paper. Light-shirt paper usually needs a mirrored print, so turn on <b>Mirror</b> below. Dark-shirt paper does not.</li><li>Cut, peel, and press using the paper’s heat guide.</li></ol>`
  };
  cap.textContent = 'Right-click the picture and choose “Save image as” to keep it.';
  return `<div class="kicker">Your badge is ready</div>
    <h1>${esc(nm)}’s Heart Language: ${L.n}</h1>
    <p class="sub">${L.blurb}</p>
    ${mixBars(st.picked)}
    <div class="cols">
      <div class="card"><span>How to love me</span><ul>${L.love.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <div class="card"><span>How I show up for others</span><ul>${L.show.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    </div>
    <div class="note"><b>Watch for:</b> ${L.watch}</div>
    <h2>Make it</h2>
    <div class="seg" role="group" aria-label="What are you making?">${FMTS.map(([k, l]) => `<button type="button" class="chip" data-a="fmt" data-v="${k}" aria-pressed="${st.format === k}">${l}</button>`).join('')}</div>
    ${st.format === 'shirt' ? `<div class="seg" role="group" aria-label="Shirt method">${[['color', 'Full color (printable iron-on)'], ['vinyl', 'One color (vinyl cut)']].map(([k, l]) => `<button type="button" class="chip" data-a="shirt" data-v="${k}" aria-pressed="${st.shirt === k}">${l}</button>`).join('')}</div>
      ${st.shirt === 'color' ? `<label class="toggle"><input type="checkbox" id="mirror" ${st.mirror ? 'checked' : ''}> Mirror the picture</label>` : '<p class="hint">Leave this picture unmirrored. Design Space mirrors it for you when you turn on Mirror.</p>'}`
      : `<label class="toggle"><input type="checkbox" id="mono" ${st.mono ? 'checked' : ''}> Black and white (saves color ink)</label>`}
    ${tips[st.format]}
    <div class="note"><b>To save:</b> right-click your picture and choose <b>Save image as</b>. Then print or upload the saved file.</div>
    <p class="credit">Inspired by Gary Chapman’s five love languages. Questions written for the ESU Graphics Center.</p>
    <div class="nav"><button type="button" class="btn" data-a="back">Back</button><button type="button" class="btn go" data-a="again">Start a new jar</button></div>`;
}
function makeOut() {
  const m = document.getElementById('mono'); if (m) m.onchange = () => { st.mono = m.checked; makeOut(); };
  const mi = document.getElementById('mirror'); if (mi) mi.onchange = () => { st.mirror = mi.checked; makeOut(); };
  const run = () => {
    const out = compose(st.format);
    outimg.src = out.toDataURL('image/png');
    outimg.alt = `${st.name.trim()}’s Heart Language ${st.format === 'card' ? 'profile card' : st.format}, ready to print`;
    stage.classList.toggle('tall', st.format === 'card');
    outimg.hidden = false; cv.hidden = true;
    outimg.style.background = st.format === 'shirt' ? 'repeating-conic-gradient(var(--chip) 0 25%, var(--surface) 0 50%) 0 0/24px 24px' : 'transparent';
  };
  document.fonts && document.fonts.ready ? document.fonts.ready.then(run) : run();
}

render();
requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(() => paint(performance.now()));
</script>
