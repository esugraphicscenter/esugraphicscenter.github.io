<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pieces of Me Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: kiosk split — question card on the left, the live mosaic on the right; stacks on phones */
:root{
  --bg:#FBEFE6; --dot:#F2DCCB; --surface:#FFFFFF; --ink:#2A1A12; --muted:#7A5E50;
  --edge:#2A1A12; --accent:#C4552A; --on-accent:#FFFFFF; --sun:#FFC72C; --on-sun:#2A1A12;
  --chip:#FFF6EF; --track:#EBD2C2;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E130E; --dot:#2B1C15; --surface:#2A1B14; --ink:#FBEFE6; --muted:#CDB3A4;
  --edge:#0B0604; --accent:#E9794B; --on-accent:#FFFFFF; --sun:#FFD25A; --on-sun:#2A1A12;
  --chip:#35241B; --track:#4A3226; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E130E; --dot:#2B1C15; --surface:#2A1B14; --ink:#FBEFE6; --muted:#CDB3A4;
  --edge:#0B0604; --accent:#E9794B; --on-accent:#FFFFFF; --sun:#FFD25A; --on-sun:#2A1A12;
  --chip:#35241B; --track:#4A3226; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 2.5px, transparent 2.6px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.restart{font:700 14px var(--body);background:transparent;color:var(--muted);border:2px solid var(--track);border-radius:999px;padding:8px 16px;cursor:pointer}
.restart.armed{border-color:var(--accent);color:var(--accent)}
.progress{display:grid;grid-template-columns:10fr 6fr;gap:18px}
.leg{display:flex;flex-direction:column;gap:6px;min-width:0}
.leg b{font:700 12px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.leg.on b{color:var(--ink)}
.pips{display:grid;gap:5px}
.pip{height:12px;border-radius:6px;background:var(--track);transition:background .25s}
.pip.done{background:var(--accent)}
.pip.now{background:var(--sun);box-shadow:0 0 0 2px var(--edge)}

.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:start}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);
  padding:30px 30px 26px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel.enter{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.kicker{font:800 13px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.12;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sub{margin:0;color:var(--muted);font-size:17px;max-width:60ch}
p{margin:0;max-width:62ch}
.lbl{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}

.imgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.img{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:8px 6px 8px;cursor:pointer;min-width:0;
  transition:transform .08s, box-shadow .08s, background .15s}
.img:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge)}
.img:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.img[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.img img{width:100%;max-width:92px;aspect-ratio:1;display:block}
.img span{font-weight:800;font-size:13.5px;line-height:1.2;text-align:center}

.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;padding:0;box-shadow:0 3px 0 var(--edge)}
.sw[aria-pressed="true"]{outline:4px solid var(--sun);outline-offset:2px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:12px 14px;cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;min-width:0}
.opt:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.opt .t{display:flex;flex-direction:column;min-width:0}
.opt .t b{font-weight:800;font-size:17px;line-height:1.25}
.opt .t span{font-size:14px;opacity:.8;line-height:1.35}
.dots{flex:none;display:flex;gap:3px}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--edge);display:block}
.stripe{flex:none;width:44px;height:28px;border-radius:8px;border:2px solid var(--edge);display:block}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:700 16px var(--body);color:var(--ink);background:var(--chip);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.field input{font:700 20px var(--display);color:var(--ink);background:var(--chip);border:3px solid var(--edge);border-radius:16px;padding:10px 16px;width:100%;max-width:440px}
.field input:focus{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.btn{font:700 18px var(--display);letter-spacing:.3px;border:3px solid var(--edge);border-radius:999px;padding:12px 26px;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--edge);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--accent);color:var(--on-accent);margin-left:auto}
.btn.sm{font-size:15px;padding:8px 18px;box-shadow:0 4px 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--edge)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.note{background:var(--chip);border:2px dashed var(--track);border-radius:16px;padding:12px 16px;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}
.pcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{display:flex;gap:10px;align-items:center;background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:8px 12px;min-width:0}
.pc img{width:46px;height:46px;flex:none}
.pc div{min-width:0;display:flex;flex-direction:column}
.pc small{font:800 11px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.pc b{font-weight:800;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.credit{font-size:13px;color:var(--muted)}

.easel{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{width:100%;max-width:520px;aspect-ratio:1;position:relative}
.stage.tall{aspect-ratio:2/3;max-width:400px}
.stage canvas,.stage img{width:100%;height:100%;display:block;object-fit:contain}
.cap{font:700 15px var(--body);color:var(--muted);text-align:center;max-width:44ch}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .easel{position:static;order:-1}
  .stage{max-width:300px}
  .stage.tall{max-width:260px}
  .panel{padding:22px 18px 20px}
}
@media (max-width:560px){
  .imgs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opts,.pcs{grid-template-columns:minmax(0,1fr)}
  .progress{grid-template-columns:minmax(0,1fr);gap:10px}
  .sw{width:38px;height:38px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="../" class="gc-home" aria-label="Back to all badges">&larr; All badges</a>
<style>.gc-home{position:fixed;left:16px;bottom:16px;z-index:50;font:700 15px system-ui,sans-serif;color:#141414;background:#FFC72C;border:3px solid #141414;border-radius:999px;padding:9px 16px;box-shadow:3px 3px 0 #141414;text-decoration:none}.gc-home:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #141414}@media print{.gc-home{display:none}}</style>
<div class="wrap">
  <header class="top">
    <div class="brand">Pieces of <span>Me</span><small>Graphics Center · Build your mosaic</small></div>
    <button type="button" class="restart" id="restart">Start over</button>
  </header>
  <div class="progress" aria-label="Progress">
    <div class="leg" id="leg1"><b>Part 1 · Pick your pieces</b><div class="pips" id="pips1" style="grid-template-columns:repeat(10,1fr)"></div></div>
    <div class="leg" id="leg2"><b>Part 2 · Set it in glass</b><div class="pips" id="pips2" style="grid-template-columns:repeat(6,1fr)"></div></div>
  </div>
  <div class="app">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="easel">
      <div class="stage" id="stage">
        <canvas id="badge" width="1080" height="1080" aria-label="Your mosaic, filling in as you answer"></canvas>
        <img id="outimg" alt="" hidden>
      </div>
      <button type="button" class="btn sm" id="recut">Cut new glass</button>
      <div class="cap" id="cap"></div>
    </aside>
  </div>
</div>

<script>
/* =============================== DATA =============================== */
const INK = '#2A1A12', TAU = Math.PI * 2;
const GLASS = [['Terracotta', '#D9653B'], ['Marigold', '#F2A900'], ['Chili', '#C8102E'], ['Rose', '#E8649A'], ['Plum', '#8E44AD'],
  ['Cobalt', '#2357C7'], ['Turquoise', '#11A3A0'], ['Jade', '#2E9E5B'], ['Olive', '#8A9A2B'], ['Cacao', '#7A4A2A']];

const TILES = [
  { k: 'Roots', h: 'Where do your roots trace back to?', sub: 'Pick one or two images. Your roots can be one place, many places, or a question you’re still answering.', ph: 'e.g. Puebla + Ghana', multi: 2,
    imgs: ['globe', 'pin', 'compass', 'treeRoots', 'mountains', 'wave', 'palm', 'cactus', 'river', 'boat', 'plane', 'magnifier'] },
  { k: 'Food', h: 'What food tastes like home?', sub: 'Pick the image closest to it.', ph: 'e.g. Abuela’s pozole',
    imgs: ['bowl', 'pot', 'skillet', 'bread', 'riceBowl', 'flatbread', 'dumpling', 'pepper', 'corn', 'fruit', 'cup', 'cake'] },
  { k: 'Music or sound', h: 'What sound or music moves you?', sub: 'The song at every family party counts. So does a voice you grew up hearing.', ph: 'e.g. Bachata on Sundays',
    imgs: ['drum', 'guitar', 'maracas', 'flute', 'piano', 'violin', 'trumpet', 'mic', 'headphones', 'notes', 'dancer', 'radio'] },
  { k: 'Celebration', h: 'What celebration do you look forward to?', ph: 'e.g. Lunar New Year',
    imgs: ['confetti', 'lantern', 'fireworks', 'gift', 'balloons', 'lights', 'garland', 'moonStar', 'sun', 'table', 'sparkler', 'banner'] },
  { k: 'Tradition', h: 'What tradition or ritual matters to you?', sub: 'Something your family does, makes, or keeps.', ph: 'e.g. Building the ofrenda',
    imgs: ['candle', 'photo', 'flower', 'book', 'needle', 'clayPot', 'joined', 'bell', 'path', 'seedling', 'textile', 'incense'] },
  { k: 'A word', h: 'What word or phrase from your family stays with you?', sub: 'Pick the image that fits it best.', ph: 'e.g. Ubuntu',
    imgs: ['speech', 'quotes', 'letters', 'pen', 'envelope', 'scroll', 'signHand', 'ear', 'chatHearts', 'language', 'bookmark', 'megaphone'] },
  { k: 'My person', h: 'Who carries your culture?', sub: 'The person who keeps it alive for you.', ph: 'e.g. My Lola',
    imgs: ['grandma', 'grandpa', 'mother', 'father', 'siblings', 'auntUncle', 'family', 'teacher', 'friends', 'child', 'ancestors', 'chosen'] },
  { k: 'A place', h: 'What place feels like home?', ph: 'e.g. Grandma’s kitchen in Ponce',
    imgs: ['house', 'apartment', 'skyline', 'farm', 'mountains', 'beach', 'kitchen', 'market', 'park', 'street', 'school', 'hometown'] },
  { k: 'A value', h: 'What value was passed down to you?', ph: 'e.g. Respeto',
    imgs: ['heart', 'handshake', 'shield', 'scales', 'bulb', 'seedling', 'community', 'star', 'anchor', 'openHand', 'flame', 'key'] },
  { k: 'Know this', h: 'What do you want people to know about your culture?', ph: 'e.g. We are not all the same',
    imgs: ['bridge', 'door', 'eye', 'mirror', 'puzzle', 'waveHand', 'heartHand', 'sunrise', 'chain', 'sparkles', 'footsteps', 'openArms'] }
];

const GROUTS = { charcoal: ['Charcoal', '#2B2420'], cream: ['Cream', '#F3EADB'], gold: ['Gold', '#C9962E'], spectrum: ['Spectrum', null] };
/* small-glass palettes. Pride palettes sit in the list under plain names, no separate heading. */
const PALS = {
  match: { n: 'Match my pieces', d: 'Each patch takes the color of the piece next to it' },
  clay: { n: 'Clay', c: ['#B5542D', '#D9653B', '#E8A15A', '#8A4B2E', '#F0C987'] },
  prism: { n: 'Prism', c: ['#E40303', '#FF8C00', '#FFED00', '#008026', '#004DFF', '#750787'] },
  ocean: { n: 'Ocean', c: ['#0B4F6C', '#01BAEF', '#2FBF71', '#5FD3E0', '#1C6E8C'] },
  cotton: { n: 'Cotton candy', c: ['#5BCEFA', '#F5A9B8', '#FFFFFF', '#F5A9B8', '#5BCEFA'] },
  garden: { n: 'Garden', c: ['#2E7D32', '#7CB342', '#C0CA33', '#F48FB1', '#FFB300'] },
  twilight: { n: 'Twilight', c: ['#D60270', '#D60270', '#9B4F96', '#0038A8', '#0038A8'] },
  jewel: { n: 'Jewel', c: ['#7B1FA2', '#00897B', '#C2185B', '#1565C0', '#F9A825'] },
  sunset: { n: 'Sunset', c: ['#D52D00', '#EF7627', '#FF9A56', '#FFFFFF', '#D162A4', '#B55690', '#A30262'] },
  citrine: { n: 'Citrine', c: ['#FCF434', '#FFFFFF', '#9C59D1', '#2C2C2C'] },
  moonlight: { n: 'Moonlight', c: ['#1A1A1A', '#A3A3A3', '#FFFFFF', '#800080'] }
};
const FINISHES = { glossy: ['Glossy', 'A little shine on every piece'], matte: ['Matte', 'Flat, soft color'], frosted: ['Frosted', 'Hazy, like sea glass'] };
const PATTERNS = { scattered: ['Scattered', 'Colors mixed like a real mosaic'], swirl: ['Swirl', 'Colors spin around the center'], rings: ['Rings', 'Colors in circles, center to edge'] };
const RINGS = {
  terra: ['Terracotta', '#D9653B'], charcoal: ['Charcoal', '#2B2420'], cream: ['Cream', '#F3EADB'], gold: ['Gold', '#C9962E'], cobalt: ['Cobalt', '#2357C7'],
  rainbow: ['Rainbow stripes', ['#E40303', '#FF8C00', '#FFED00', '#008026', '#004DFF', '#750787']],
  progress: ['Progress stripes', ['#000000', '#784F17', '#5BCEFA', '#F5A9B8', '#FFFFFF', '#E40303', '#FF8C00', '#FFED00', '#008026', '#004DFF', '#750787']]
};
const Q2 = [
  { k: 'center', h: 'What goes in the center?', sub: 'Your name, your initials, or one word in your heritage language. This is the only text on your button.' },
  { k: 'grout', h: 'Pick your grout', sub: 'Grout is the line between the pieces of glass.' },
  { k: 'pal', h: 'Pick the colors for your small glass', sub: 'The small pieces fill in around your 10 picture pieces.' },
  { k: 'finish', h: 'Pick your glass finish' },
  { k: 'pattern', h: 'How should the small glass be laid?' },
  { k: 'ring', h: 'Pick your outer ring', sub: 'On a button, this ring folds around the edge, so you see it on the side.' }
];
const FLOW = ['intro', ...TILES.map((_, i) => ({ p: 1, i })), ...Q2.map((_, i) => ({ p: 2, i })), 'finish'];
const P2 = TILES.length + 1;

function fresh() {
  return { p: TILES.map((_, i) => ({ img: [], col: i, words: '' })), center: '', grout: 'charcoal', pal: 'match', finish: 'glossy',
    pattern: 'scattered', ring: 'terra', seed: (Math.random() * 1e9) | 0, format: 'button', shirt: 'color', mirror: false, mono: false };
}
let st = fresh(), pos = 0, hover = null, dirty = true;

/* =============================== COLOR =============================== */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgb2hex(r) { return '#' + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B2 = hex2rgb(b); return rgb2hex(A.map((v, i) => v + (B2[i] - v) * t)); }
function lum(hex) { const [r, g, b] = hex2rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function hsl(hex) {
  let [r, g, b] = hex2rgb(hex).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s * 100, l * 100];
}
function jit(hex, j, k) { const [h, s, l] = hsl(hex); const L = Math.max(4, Math.min(97, l + j * 7 - (l > 92 ? 4 : 0))); return `hsl(${(h + k * 5).toFixed(1)},${s.toFixed(1)}%,${L.toFixed(1)}%)`; }
const glassCol = i => GLASS[st.p[i].col][1];

/* =============================== ICON KIT =============================== */
/* Each image is drawn in a ~180px box centred on 0,0 with thick ink outlines.
   F = main glass color, T = light tint, Wc = white. In line mode (vinyl) the fills are null and shapes punch out. */
let X, LW = 8, INKC = INK, F, T, Wc, H, LINE = false;
const B = () => X.beginPath();
function cir(x, y, r) { B(); X.arc(x, y, r, 0, TAU); }
function rct(x, y, w, h, r = 8) { B(); X.roundRect(x, y, w, h, r); }
function pol(...a) { B(); X.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) X.lineTo(a[i], a[i + 1]); X.closePath(); }
function ell(x, y, rx, ry, rot = 0) { B(); X.ellipse(x, y, rx, ry, rot, 0, TAU); }
function pl(p) { B(); p.forEach((q, i) => i ? X.lineTo(q[0], q[1]) : X.moveTo(q[0], q[1])); }
function sp(p) { B(); X.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length - 1; i++) X.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2); const l = p[p.length - 1]; X.lineTo(l[0], l[1]); }
function erase() { X.save(); X.globalCompositeOperation = 'destination-out'; X.fillStyle = '#000'; X.fill(); X.restore(); }
function strk(w = LW) { X.lineWidth = w; X.strokeStyle = INKC; X.lineJoin = 'round'; X.lineCap = 'round'; X.stroke(); }
function s(fill, w) { if (fill) { X.fillStyle = fill; X.fill(); } else if (LINE && fill === null) erase(); strk(w); }
function ink() { X.fillStyle = INKC; X.fill(); }
function ln(p, w) { pl(p); strk(w); }
function sm(p, w) { sp(p); strk(w); }
function tk(bs, fill, w) { bs.forEach(b => { b(); strk(w + LW * 1.6); }); bs.forEach(b => { b(); if (fill) { X.strokeStyle = fill; X.lineWidth = w; X.stroke(); } else { X.save(); X.globalCompositeOperation = 'destination-out'; X.strokeStyle = '#000'; X.lineWidth = w; X.stroke(); X.restore(); } }); }

    o.fillStyle = '#7A5E50'; o.font = "800 21px Nunito, system-ui, sans-serif"; o.fillText(TILES[i].k.toUpperCase(), x + 118, y + 30);
    o.fillStyle = INK; o.font = "700 29px Nunito, system-ui, sans-serif"; wrapText(o, pieceText(i), x + 118, y + 66, 380, 34, 2);
  });
  o.fillStyle = '#B59A8A'; o.font = "700 22px Nunito, system-ui, sans-serif"; o.textAlign = 'center';
  o.fillText('ESU Graphics Center · Every piece chosen by me', W / 2, 1750);
  return st.mono ? gray(out) : out;
}

/* =============================== UI =============================== */
const panel = document.getElementById('panel'), cap = document.getElementById('cap'), outimg = document.getElementById('outimg'), stage = document.getElementById('stage');
const esc = s2 => String(s2).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const THUMB = {};
function thumb(key, col) {
  const id = key + col; if (THUMB[id]) return THUMB[id];
  const t = document.createElement('canvas'); t.width = t.height = 184; const c = t.getContext('2d');
  c.beginPath(); c.roundRect(4, 4, 176, 176, 34); c.fillStyle = mix(col, '#FFFFFF', .82); c.fill();
  drawIcon(c, key, 92, 92, 142, col);
  return (THUMB[id] = t.toDataURL('image/png'));
}
function pips() {
  [['pips1', 1, TILES.length], ['pips2', P2, Q2.length]].forEach(([id, start, n]) => {
    let h = ''; for (let i = 0; i < n; i++) { const at = start + i; h += `<span class="pip ${pos > at ? 'done' : pos === at ? 'now' : ''}"></span>`; }
    document.getElementById(id).innerHTML = h;
  });
  document.getElementById('leg1').classList.toggle('on', pos >= 1 && pos < P2);
  document.getElementById('leg2').classList.toggle('on', pos >= P2 && FLOW[pos] !== 'finish');
}
function canNext() {
  const f = FLOW[pos];
  if (f === 'intro') return true;
  if (f.p === 1) return st.p[f.i].img.length > 0;
  if (Q2[f.i].k === 'center') return !!st.center.trim();
  return true;
}
function navHTML(label) {
  return `<div class="nav">${pos > 0 ? '<button type="button" class="btn" data-a="back">Back</button>' : ''}<button type="button" class="btn go" id="next" data-a="next" ${canNext() ? '' : 'disabled'}>${label}</button></div>`;
}
function refreshNext() { const n = document.getElementById('next'); if (n) n.disabled = !canNext(); }

function tileBody(i) {
  const t = TILES[i], q = st.p[i], col = glassCol(i);
  return `<div class="imgs" role="group" aria-label="Images for ${esc(t.k)}">${t.imgs.map(k => `<button type="button" class="img" data-a="img" data-v="${k}" aria-pressed="${q.img.includes(k)}"><img src="${thumb(k, col)}" alt=""><span>${esc(ICONS[k][0])}</span></button>`).join('')}</div>
    ${t.multi ? `<p class="hint">${q.img.length} of 2 picked. Tap one again to remove it.</p>` : ''}
    <div class="lbl">Glass color</div>
    <div class="sws" role="group" aria-label="Glass color">${GLASS.map(([n, h], k) => `<button type="button" class="sw" data-a="col" data-v="${k}" style="background:${h}" aria-label="${n}" aria-pressed="${q.col === k}" title="${n}"></button>`).join('')}</div>`;
}
function optBtn(k, key, label, desc, art, on) {
  return `<button type="button" class="opt" data-a="q2" data-k="${k}" data-v="${key}" aria-pressed="${on}">${art}<span class="t"><b>${esc(label)}</b>${desc ? `<span>${esc(desc)}</span>` : ''}</span></button>`;
}
const dots = cols => `<span class="dots" aria-hidden="true">${cols.slice(0, 5).map(h => `<i style="background:${h}"></i>`).join('')}</span>`;
const stripeBg = cols => `linear-gradient(${cols.map((h, i) => `${h} ${i / cols.length * 100}% ${(i + 1) / cols.length * 100}%`).join(',')})`;
const roundStripe = cols => `<span class="dots" aria-hidden="true"><i style="background:${stripeBg(cols)}"></i></span>`;
const stripe = cols => `<span class="stripe" aria-hidden="true" style="background:linear-gradient(${cols.map((h, i) => `${h} ${i / cols.length * 100}% ${(i + 1) / cols.length * 100}%`).join(',')})"></span>`;
function designBody(i) {
  const k = Q2[i].k;
  if (k === 'center') return `<div class="field"><label for="center">Center word</label><input id="center" maxlength="12" autocomplete="off" value="${esc(st.center)}" placeholder="Name, initials, or a word"></div><p class="hint">Up to 12 letters.</p>`;
  if (k === 'grout') return `<div class="opts">${Object.entries(GROUTS).map(([key, [n, h]]) => optBtn('grout', key, n, '', h ? dots([h]) : roundStripe(['#E40303', '#FF8C00', '#FFED00', '#008026', '#004DFF', '#750787']), st.grout === key)).join('')}</div>`;
  if (k === 'pal') return `<div class="opts">${Object.entries(PALS).map(([key, p]) => optBtn('pal', key, p.n, p.d || '', dots(p.c ? [...new Set(p.c)] : st.p.map(q => GLASS[q.col][1])), st.pal === key)).join('')}</div>`;
  if (k === 'finish') return `<div class="opts">${Object.entries(FINISHES).map(([key, [n, d]]) => optBtn('finish', key, n, d, '', st.finish === key)).join('')}</div>`;
  if (k === 'pattern') return `<div class="opts">${Object.entries(PATTERNS).map(([key, [n, d]]) => optBtn('pattern', key, n, d, '', st.pattern === key)).join('')}</div>`;
  if (k === 'ring') return `<div class="opts">${Object.entries(RINGS).map(([key, [n, h]]) => optBtn('ring', key, n, '', Array.isArray(h) ? roundStripe(h) : dots([h]), st.ring === key)).join('')}</div>`;
}
function screenHTML() {
  const f = FLOW[pos];
  if (f.p === 1) { const t = TILES[f.i]; return `<div class="kicker">Piece ${f.i + 1} of ${TILES.length} · ${esc(t.k)}</div><h1>${esc(t.h)}</h1>${t.sub ? `<p class="sub">${esc(t.sub)}</p>` : ''}${tileBody(f.i)}${navHTML(f.i === TILES.length - 1 ? 'Set it in glass' : 'Next')}`; }
  const q = Q2[f.i];
  return `<div class="kicker">Set it in glass · ${f.i + 1} of ${Q2.length}</div><h1>${esc(q.h)}</h1>${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ''}${designBody(f.i)}${navHTML(f.i === Q2.length - 1 ? 'Finish my mosaic' : 'Next')}`;
}
function render() {
  const f = FLOW[pos];
  hover = null; dirty = true;
  panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter');
  pips();
  outimg.hidden = true; cv.hidden = false; stage.classList.remove('tall');
  if (f === 'intro') {
    panel.innerHTML = `<div class="kicker">ESU Graphics Center</div>
      <h1>What pieces make you, you?</h1>
      <p class="sub">Answer 10 questions about your heritage and your culture: the food, the music, the people, the places. Each answer becomes a piece of glass in your mosaic, with an image you pick and a color you choose.</p>
      <p>There’s no wrong way to answer. Your roots might be one place, many places, or something you’re still discovering. All of it counts.</p>
      <p class="sub">Then set your glass and leave with it as a button, sticker, keychain, iron-on for a shirt, or a profile card.</p>
      ${navHTML('Start')}`;
    cap.textContent = 'Your mosaic fills in as you answer.';
  } else if (f === 'finish') {
    panel.innerHTML = finishHTML();
    makeOut();
  } else {
    panel.innerHTML = screenHTML(); wire();
    cap.textContent = f.p === 1 ? 'The glowing piece is the one you’re filling in.' : 'Point at an option to preview it. The dashed line shows where a button folds.';
  }
}
function rerender(focusSel) {
  const y = window.scrollY; panel.innerHTML = screenHTML(); wire(); window.scrollTo(0, y); dirty = true;
  const el = focusSel && panel.querySelector(focusSel); if (el) el.focus({ preventScroll: true });
}
function wire() {
  const c = document.getElementById('center'); if (c) { c.addEventListener('input', () => { st.center = c.value; dirty = true; refreshNext(); }); c.addEventListener('keydown', e => { if (e.key === 'Enter' && canNext()) go(1); }); }
  panel.querySelectorAll('[data-a="q2"]').forEach(b => {
    b.addEventListener('pointerenter', () => { hover = { k: b.dataset.k, v: b.dataset.v }; dirty = true; });
    b.addEventListener('pointerleave', () => { hover = null; dirty = true; });
  });
}

let restartArmed = null;
document.getElementById('restart').onclick = e => {
  const b = e.currentTarget;
  if (restartArmed) { clearTimeout(restartArmed); restartArmed = null; b.classList.remove('armed'); b.textContent = 'Start over'; st = fresh(); pos = 0; render(); return; }
  b.classList.add('armed'); b.textContent = 'Tap again to start over';
  restartArmed = setTimeout(() => { restartArmed = null; b.classList.remove('armed'); b.textContent = 'Start over'; }, 3000);
};
document.getElementById('recut').onclick = () => { st.seed = (Math.random() * 1e9) | 0; dirty = true; if (FLOW[pos] === 'finish') makeOut(); };
function go(d) {
  pos = Math.max(0, Math.min(FLOW.length - 1, pos + d));
  render(); window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const act = b.dataset.a, v = b.dataset.v, f = FLOW[pos];
  if (act === 'next') { if (canNext()) go(1); return; }
  if (act === 'back') { go(-1); return; }
  if (act === 'again') { st = fresh(); pos = 0; render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'fmt') { st.format = v; panel.innerHTML = finishHTML(); makeOut(); return; }
  if (act === 'shirt') { st.shirt = v; panel.innerHTML = finishHTML(); makeOut(); return; }
  if (act === 'q2') { st[b.dataset.k] = v; hover = null; rerender(`[data-a="q2"][data-k="${b.dataset.k}"][data-v="${v}"]`); return; }
  if (typeof f !== 'object' || f.p !== 1) return;
  const q = st.p[f.i], t = TILES[f.i];
  if (act === 'img') {
    const n = q.img.indexOf(v);
    if (n >= 0) q.img.splice(n, 1);
    else if (t.multi) { q.img.push(v); if (q.img.length > t.multi) q.img.shift(); }
    else q.img = [v];
    rerender(`[data-a="img"][data-v="${v}"]`); return;
  }
  if (act === 'col') { q.col = +v; rerender(`[data-a="col"][data-v="${v}"]`); return; }
});

/* ---------- finish ---------- */
const FMTS = [['button', 'Button'], ['sticker', 'Sticker'], ['keychain', 'Keychain'], ['shirt', 'Shirt (Cricut)'], ['card', 'Profile card']];
function finishHTML() {
  const tips = {
    button: '<p>The outer ring wraps around the edge of the button. Your 10 pieces and center word stay on the front.</p>',
    sticker: '<p>Print on sticker paper and cut along the dotted line.</p>',
    keychain: '<p>Print, laminate, and cut along the dotted line. Punch the small circle at the top for the ring.</p>',
    card: '<p>A 4 × 6 profile card with your mosaic and the 10 pieces that make you. Print it on cardstock.</p>',
    shirt: st.shirt === 'vinyl'
      ? `<ol class="steps"><li>Save the picture, then upload it to Cricut Design Space. Choose <b>Complex</b> so the small pieces stay, and keep it as one layer.</li><li>Size it about 8–10 in wide for the front. Mosaics get busy small, so skip chest-logo size for vinyl.</li><li>Load heat transfer vinyl shiny side down. Turn on <b>Mirror</b> on the mat screen before you cut.</li><li>Weed out the grout lines and press it using your vinyl’s heat guide.</li></ol>`
      : `<ol class="steps"><li>Save the picture, then upload it to Cricut Design Space as a <b>Print Then Cut</b> image.</li><li>Keep it within about 6.75 × 9.25 in (the Print Then Cut limit).</li><li>Print on printable heat transfer paper. Light-shirt paper usually needs a mirrored print, so turn on <b>Mirror</b> below. Dark-shirt paper does not.</li><li>Cut, peel, and press using the paper’s heat guide.</li></ol>`
  };
  cap.textContent = 'Right-click the picture and choose “Save image as” to keep it.';
  return `<div class="kicker">Your mosaic is ready</div>
    <h1>Every piece is yours.</h1>
    <p class="sub">Here’s what your mosaic holds.</p>
    <div class="pcs">${st.p.map((q, i) => `<div class="pc"><img src="${thumb(q.img[0], GLASS[q.col][1])}" alt=""><div><small>${esc(TILES[i].k)}</small><b>${esc(pieceText(i))}</b></div></div>`).join('')}</div>
    <h2>Make it</h2>
    <div class="seg" role="group" aria-label="What are you making?">${FMTS.map(([k, l]) => `<button type="button" class="chip" data-a="fmt" data-v="${k}" aria-pressed="${st.format === k}">${l}</button>`).join('')}</div>
    ${st.format === 'shirt' ? `<div class="seg" role="group" aria-label="Shirt method">${[['color', 'Full color (printable iron-on)'], ['vinyl', 'One color (vinyl cut)']].map(([k, l]) => `<button type="button" class="chip" data-a="shirt" data-v="${k}" aria-pressed="${st.shirt === k}">${l}</button>`).join('')}</div>
      ${st.shirt === 'color' ? `<label class="toggle"><input type="checkbox" id="mirror" ${st.mirror ? 'checked' : ''}> Mirror the picture</label>` : '<p class="hint">Leave this picture unmirrored. Design Space mirrors it for you when you turn on Mirror.</p>'}`
      : `<label class="toggle"><input type="checkbox" id="mono" ${st.mono ? 'checked' : ''}> Black and white (saves color ink)</label>`}
    ${tips[st.format]}
    <div class="note"><b>To save:</b> right-click your picture and choose <b>Save image as</b>. Then print or upload the saved file. Want a different arrangement? Tap <b>Cut new glass</b>.</div>
    <p class="credit">Images drawn for the ESU Graphics Center. The meaning of each piece is yours.</p>
    <div class="nav"><button type="button" class="btn" data-a="back">Back</button><button type="button" class="btn go" data-a="again">Start a new mosaic</button></div>`;
}
function makeOut() {
  const m = document.getElementById('mono'); if (m) m.onchange = () => { st.mono = m.checked; makeOut(); };
  const mi = document.getElementById('mirror'); if (mi) mi.onchange = () => { st.mirror = mi.checked; makeOut(); };
  const run = () => {
    const out = compose(st.format);
    outimg.src = out.toDataURL('image/png');
    outimg.alt = `${st.center.trim()}’s Pieces of Me ${st.format === 'card' ? 'profile card' : st.format}, ready to print`;
    stage.classList.toggle('tall', st.format === 'card');
    outimg.hidden = false; cv.hidden = true;
    outimg.style.background = st.format === 'shirt' ? 'repeating-conic-gradient(var(--chip) 0 25%, var(--surface) 0 50%) 0 0/24px 24px' : 'transparent';
  };
  document.fonts && document.fonts.ready ? document.fonts.ready.then(run) : run();
}

render();
requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(() => { dirty = true; });
</script>
</body>
</html>
