<title>Critter Crew Badge</title>

<style>
/* Layout: kiosk split — question card on the left, a live badge "easel" on the right; stacks on phones */
:root{
  --bg:#E6F0FF; --dot:#D2E2FA; --surface:#FFFFFF; --ink:#1F2340; --muted:#545E88;
  --edge:#1F2340; --accent:#FF6B57; --on-accent:#FFFFFF; --sun:#FFC83D; --on-sun:#1F2340;
  --mint:#2FB397; --chip:#F1F6FF; --track:#C9D8F2;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121634; --dot:#1A2049; --surface:#1E2450; --ink:#F3F5FF; --muted:#AAB2DA;
  --edge:#05071A; --accent:#FF7E6B; --on-accent:#FFFFFF; --sun:#FFD25E; --on-sun:#1F2340;
  --mint:#4CCFB1; --chip:#272E60; --track:#2E366B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121634; --dot:#1A2049; --surface:#1E2450; --ink:#F3F5FF; --muted:#AAB2DA;
  --edge:#05071A; --accent:#FF7E6B; --on-accent:#FFFFFF; --sun:#FFD25E; --on-sun:#1F2340;
  --mint:#4CCFB1; --chip:#272E60; --track:#2E366B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 2.5px, transparent 2.6px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.restart{font:700 14px var(--body);background:transparent;color:var(--muted);border:2px solid var(--track);border-radius:999px;padding:8px 16px;cursor:pointer}
.restart.armed{border-color:var(--accent);color:var(--accent)}

.progress{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.leg{display:flex;flex-direction:column;gap:6px;min-width:0}
.leg b{font:700 12px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.leg.on b{color:var(--ink)}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pip{height:12px;border-radius:6px;background:var(--track);transition:background .25s}
.pip.done{background:var(--accent)}
.pip.now{background:var(--sun);box-shadow:0 0 0 2px var(--edge)}

.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:start}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);
  padding:30px 30px 26px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel.enter{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.kicker{font:800 13px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.12;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sub{margin:0;color:var(--muted);font-size:17px;max-width:60ch}
p{margin:0;max-width:62ch}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:14px 16px;cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;min-width:0}
.opt:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.opt[aria-pressed="true"] .k{background:var(--edge);color:var(--sun)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);
  background:var(--chip);color:var(--ink);border:2px solid var(--edge)}
.opt .t{display:flex;flex-direction:column;min-width:0}
.opt .t b{font-weight:800;font-size:18px;line-height:1.25}
.opt .t span{font-size:14.5px;opacity:.8;line-height:1.35}
.opt[aria-pressed="true"] .t span{opacity:.85}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--edge)}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:700 16px var(--body);color:var(--ink);background:var(--chip);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.field input{font:700 22px var(--display);color:var(--ink);background:var(--chip);border:3px solid var(--edge);border-radius:16px;padding:12px 16px;width:100%;max-width:420px}
.field input:focus{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.btn{font:700 18px var(--display);letter-spacing:.3px;border:3px solid var(--edge);border-radius:999px;padding:12px 26px;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--edge);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--accent);color:var(--on-accent);margin-left:auto}
.btn.big{font-size:22px;padding:16px 36px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--edge)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--chip);border:2px solid var(--edge);border-radius:16px;padding:10px 14px;min-width:0}
.fact span{display:block;font:800 11.5px var(--body);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25}
.mix{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 38px;gap:10px;align-items:center;font-weight:800;font-size:15px}
.bar .tr{height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.bar .fl{height:100%;border-radius:7px;background:var(--mint)}
.bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.note{background:var(--chip);border:2px dashed var(--track);border-radius:16px;padding:12px 16px;font-size:15px;color:var(--muted)}

.seg{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

.easel{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{width:100%;max-width:520px;aspect-ratio:1;position:relative}
.stage canvas,.stage img{width:100%;height:100%;display:block}
.stage img{background:transparent}
.stage [hidden]{display:none}
.cap{font:700 15px var(--body);color:var(--muted);text-align:center;max-width:40ch}


.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
.opt.big{min-height:150px;align-items:center;justify-content:center;text-align:center}
.opt.big .t b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2}
.or{align-self:center;font:700 20px var(--display);background:var(--accent);color:var(--on-accent);border:3px solid var(--edge);border-radius:50%;width:56px;height:56px;display:grid;place-items:center}
.rounds{display:flex;align-items:center;gap:8px}
.rd{width:36px;height:36px;border-radius:50%;border:2px solid var(--edge);background:var(--chip);color:var(--ink);font:700 15px var(--display);cursor:pointer}
.rd.got{background:var(--mint);color:var(--on-accent)}
.rd.cur{box-shadow:0 0 0 3px var(--sun)}
.rd:disabled{opacity:.4;cursor:default}
.flash{background:var(--ink);color:var(--surface);border:3px solid var(--edge);border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.flash span{font:700 clamp(38px,5vw,56px)/1 var(--display);letter-spacing:4px}
.timer{width:70%;height:8px;border-radius:4px;background:rgba(127,127,160,.35);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sun);transform-origin:left;animation:shrink 8s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.wordchips .chip{font-size:18px;padding:10px 18px}
.opt.pic{flex-direction:column;align-items:stretch;padding:10px;gap:8px}
.opt.pic svg{width:100%;height:auto;border-radius:12px;border:2px solid var(--edge);display:block}
.opt.pic .t{align-items:center}
.sliders{display:flex;flex-direction:column;gap:24px}
.sl{display:flex;flex-direction:column;gap:6px}
.sl .ends{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:16px}
.sl input{width:100%;accent-color:var(--accent);height:30px;cursor:pointer}
.read{font:600 16px var(--display);color:var(--accent);text-align:center}
.bag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{border:3px dashed var(--track);border-radius:16px;padding:10px;text-align:center;font-weight:800;font-size:15px;color:var(--muted);min-height:58px;display:grid;place-items:center}
.slot.full{border-style:solid;border-color:var(--edge);background:var(--sun);color:var(--on-sun)}
.tiles .opt{padding:10px 14px}
.then{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:3px dashed var(--track)}
.shapes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.opt.shp{flex-direction:column;align-items:center;padding:12px 6px;gap:6px}
.opt.shp svg{width:60px;height:60px}
.opt.shp b{font:600 16px var(--display)}
.rows{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-direction:column;gap:8px}
.cue{font:600 20px var(--display)}
.left{font:600 20px var(--display)}
.left b{font-size:36px;color:var(--accent);font-variant-numeric:tabular-nums}
.alloc{display:flex;flex-direction:column;gap:14px}
.al{display:grid;grid-template-columns:118px 42px minmax(0,1fr) 42px 26px;gap:10px;align-items:center}
.nm{font-weight:800}
.pm{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);background:var(--surface);color:var(--ink);font:700 22px var(--display);cursor:pointer;box-shadow:0 3px 0 var(--edge);line-height:1}
.pm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pm:disabled{opacity:.35;cursor:default}
.pdots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.pdots i{height:18px;border-radius:5px;background:var(--track)}
.pdots i.on{background:var(--mint)}
.al em{font-style:normal;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.sentence{font:600 clamp(22px,2.6vw,30px)/1.45 var(--display);background:var(--chip);border:3px solid var(--edge);border-radius:20px;padding:16px 20px}
.gap{color:var(--muted)}
.fill{background:var(--sun);color:var(--on-sun);border-radius:10px;padding:0 8px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .easel{position:static;order:-1}
  .stage{max-width:300px}
  .panel{padding:22px 18px 20px}
}
@media (max-width:520px){
  .opts,.facts{grid-template-columns:minmax(0,1fr)}
  .duo{grid-template-columns:minmax(0,1fr)} .or{justify-self:center}
  .shapes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .al{grid-template-columns:84px 38px minmax(0,1fr) 38px 22px;gap:6px}
  .pm{width:38px;height:38px}
  .opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .progress{grid-template-columns:minmax(0,1fr);gap:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Critter <span>Crew</span><small>Graphics Center · Make your leader creature</small></div>
    <button type="button" class="restart" id="restart">Start over</button>
  </header>
  <div class="progress" aria-label="Progress">
    <div class="leg" id="leg1"><b>Part 1 · Find your animal</b><div class="pips" id="pips1"></div></div>
    <div class="leg" id="leg2"><b>Part 2 · Bring it to life</b><div class="pips" id="pips2"></div></div>
  </div>
  <div class="app">
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="easel">
      <div class="stage">
        <canvas id="badge" width="1080" height="1080" aria-label="Your badge, updating as you answer"></canvas>
        <img id="outimg" alt="Your finished creature badge" hidden>
      </div>
      <div class="cap" id="cap"></div>
    </aside>
  </div>
</div>

<script>
/* =============================== DATA =============================== */
const INK = '#1F2340';
const ANIMALS = {
  wolf:{mot:['keep the pack together','build trust','stay loyal'], n:'Wolf', style:'The Pack Leader', fur:'#8E9AAF', light:'#EEF1F6', dark:'#5D677A', nose:'#2A2F45', feet:'#5D677A',
    blurb:'You lead from inside the group. You notice who is falling behind, and you make sure the whole pack gets there together.',
    str:['Builds trust','Keeps the team together','Loyal under pressure'],
    edge:'Sometimes the pack needs you to make the call, even when not everyone agrees.',
    names:['Scout','Captain Howl','Luna','Rocky']},
  owl:{mot:['think ahead','ask smart questions','see the whole map'], n:'Owl', style:'The Strategist', fur:'#A9774E', light:'#F6E3C2', dark:'#6E4A2E', nose:'#F4A62A', feet:'#F4A62A',
    blurb:'You see the whole map before anyone takes a step. People come to you when they need a plan that actually works.',
    str:['Thinks ahead','Asks smart questions','Calm with the facts'],
    edge:'Don’t wait for the perfect plan. A good plan today often beats a great one next week.',
    names:['Professor Hoot','Sage','Olive','Dr. Feathers']},
  fox:{mot:['find the side door','adapt fast','try new angles'], n:'Fox', style:'The Innovator', fur:'#F07F3C', light:'#FFF4E6', dark:'#3B2A2A', nose:'#2A2F45', feet:'#3B2A2A',
    blurb:'When the usual way doesn’t work, you find a side door. You turn problems into puzzles.',
    str:['Creative fixes','Adapts fast','Sees new angles'],
    edge:'Finish what you start before you chase the next big idea.',
    names:['Ember','Rusty','Juniper','Sly Ty']},
  bear:{mot:['stay steady','have their backs','stay calm in the storm'], n:'Bear', style:'The Protector', fur:'#9A6440', light:'#E8C399', dark:'#5E3A22', nose:'#2A2F45', feet:'#5E3A22',
    blurb:'You stay steady when things get loud. People feel safe around you, and that makes them brave.',
    str:['Calm under pressure','Dependable','Has people’s backs'],
    edge:'Let others carry some of the weight. Asking for help is strength too.',
    names:['Bruno','Honey','Big Mo','Maple']},
  otter:{mot:['bring the spark','connect people','welcome everyone'], n:'Otter', style:'The Energizer', fur:'#8A5A3C', light:'#EBCCA8', dark:'#573621', nose:'#2A2F45', feet:'#573621',
    blurb:'You bring the spark. Groups have more fun, talk more, and stick around longer when you are there.',
    str:['Connects people','Lifts the mood','Makes newcomers feel welcome'],
    edge:'Fun keeps people around. Follow-through keeps the work moving. Practice both.',
    names:['Splash','Pebble','Ollie','Squeaky']},
  lion:{mot:['step up first','speak up','set the vision'], n:'Lion', style:'The Trailblazer', fur:'#F2B544', light:'#FFE8B0', dark:'#C9702B', mane:'#C9702B', nose:'#6B3A2A', feet:'#C9702B',
    blurb:'You step up first and point the way. Your confidence gives other people permission to be bold.',
    str:['Takes initiative','Speaks up','Sets the vision'],
    edge:'Leave room for quieter voices. The best roar listens first.',
    names:['Leo','Sunny','Rex','Goldie']},
  elephant:{mot:['lift others up','remember people','grow new leaders'], n:'Elephant', style:'The Mentor', fur:'#A8B3C4', light:'#E9C3CC', dark:'#6E7A8E', nose:'#6E7A8E', feet:'#6E7A8E',
    blurb:'You remember people: their names, their goals, the thing they were worried about last week. You lead by lifting others up.',
    str:['Empathy','Patience','Grows new leaders'],
    edge:'Your goals count too. Make time for your own growth, not just everyone else’s.',
    names:['Peanut','Ellie','Mosey','Big Gray']},
  penguin:{mot:['plan for the storm','show up every time','turn chaos into a plan'], n:'Penguin', style:'The Organizer', fur:'#2F3446', light:'#FFFFFF', dark:'#1C2030', nose:'#FFB02E', feet:'#FFB02E',
    blurb:'You turn chaos into a checklist. When the weather gets rough, your team knows what to do because you planned for it.',
    str:['Organized','Reliable','Strong teamwork in tough conditions'],
    edge:'Plans change. Practice rolling with the moments you can’t schedule.',
    names:['Tux','Pip','Waddles','Captain Ice']}
};

const Q1 = [
  {t:'wyr', title:'Would you rather…', sub:'Three quick rounds. Go with your gut.', rounds:[
    [['Take on a big project solo','owl penguin','own the big project'],['Split it up with a team','wolf elephant','build it together']],
    [['Do it the way that’s always worked','penguin bear','trust what works'],['Try a brand-new way','fox lion','try a brand-new way']],
    [['Be front and center','lion otter','step into the spotlight'],['Work behind the scenes','owl fox','make it happen backstage']]]},
  {t:'scene', title:'Which picture feels the most like you?', sub:'Don’t overthink it. Which one pulls you in?', o:[
    ['campfire','Campfire circle','elephant bear'],['summit','Mountain summit','lion wolf'],
    ['desk','Desk lamp at midnight','owl penguin'],['splash','Cannonball into the lake','otter fox']]},
  {t:'slider', title:'Where do you land?', sub:'Slide each one. There is no wrong spot.', s:[
    ['I decide fast','I take my time',['lion fox','lion','wolf','owl','owl penguin']],
    ['I recharge with people','I recharge alone',['otter elephant','otter','wolf','bear','owl bear']],
    ['I see the big picture','I see the details',['lion fox','fox','elephant','penguin','penguin owl']]]},
  {t:'word', title:'First thing that comes to mind…', sub:'A word flashes. Tap the first answer that jumps out at you.', rounds:[
    ['DEADLINE',[['Checklist','penguin'],['Challenge','lion'],['Teamwork','wolf'],['Shortcut','fox'],['Breathe','bear'],['Help','elephant'],['Strategy','owl'],['Snacks','otter']]],
    ['MISTAKE',[['Own it','bear'],['Fix it fast','fox'],['Lesson','owl'],['Laugh it off','otter'],['New plan','penguin'],['Check on the team','elephant'],['Try again','lion'],['Stick together','wolf']]],
    ['STORM',[['Shelter','bear'],['Adventure','lion'],['Puddles','otter'],['Radar','owl'],['Supplies','penguin'],['Huddle','wolf'],['Check on people','elephant'],['Lightning idea','fox']]]]},
  {t:'pack', title:'Road trip with the team. Pack exactly three things.', sub:'Your bag only holds three. Choose wisely.', o:[
    ['Map','owl'],['Walkie-talkies','wolf'],['First-aid kit','bear'],['Snacks for everyone','elephant'],
    ['Speaker and playlist','otter'],['Megaphone','lion'],['Duct tape','fox'],['Checklist and spare batteries','penguin']]},
  {t:'whatif', title:'What if you woke up tomorrow as president of a club?', sub:'Pick your first move. Then pick what comes next.', o:[
    ['Throw a kickoff party','otter',[['Invite every org on campus','lion'],['Make sure every member gets a role','wolf']]],
    ['Meet every member one-on-one','elephant',[['Write down everyone’s goals','owl'],['Ask what is stressing them out','bear']]],
    ['Rebuild the plan for the year','penguin',[['Lock in a calendar and deadlines','penguin'],['Scrap the old rules and try something new','fox']]],
    ['Announce one huge goal','lion',[['Rally everyone behind it','wolf'],['Find the clever shortcut to get there','fox']]]]},
  {t:'shape', title:'If you drew yourself as a shape, which one?', sub:'Just for fun. Pick the one that feels like you.', o:[
    ['circle','Circle','elephant otter','Circle people bring others together and keep the peace.'],

    cap.textContent = answered() >= 8 ? 'Something is about to hatch…' : 'Your egg cracks a little more with every answer.';
  } else {
    const q = Q2[f.i], n = 11 + f.i;
    let body = '';
    if (q.type === 'color') {
      body = `<div class="opts" role="group" aria-label="Colors">${Object.entries(COLORS).map(([k, c], j) => `<button type="button" class="opt" id="o${j}" data-v="${k}" aria-pressed="${st.color === k}"><span class="sw" style="background:${c.c}"></span><span class="t"><b>${c.l}</b></span></button>`).join('')}</div>`;
    } else if (q.type === 'motto') {
      const m = st.motto, P = c => c ? 'true' : 'false';
      body = `<div class="sentence">${m.start ? `<span class="fill">${m.start}</span>` : '<span class="gap">____</span>'} ${m.end.trim() ? `<span class="fill">${esc(m.end.trim())}</span>` : '<span class="gap">__________</span>'}</div>
        <h2>1. Start it</h2>
        <div class="chips" role="group" aria-label="Start">${['I', 'We', 'Always', 'Never'].map((w, j) => `<button type="button" class="chip" id="o${j}" data-ms="${w}" aria-pressed="${P(m.start === w)}">${w}…</button>`).join('')}</div>`;
      if (m.start) {
        const ideas = mottoIdeas(m.start), room = MOTTO_MAX - m.start.length - 1;
        const chip = (x, id) => `<button type="button" class="chip" id="${id}" data-me="${esc(x)}" aria-pressed="${P(m.end.trim() === x)}">${esc(x)}</button>`;
        body += `<h2>2. Finish it</h2>
          ${ideas.mine.length ? `<p class="hint">From your answers</p><div class="chips" role="group" aria-label="From your answers">${ideas.mine.map((x, j) => chip(x, 'me' + j)).join('')}</div>` : ''}
          ${ideas.more.length ? `<p class="hint">${m.start === 'Never' ? 'More ideas' : 'From your ' + ANIMALS[picked].n.toLowerCase()}</p><div class="chips" role="group" aria-label="More ideas">${ideas.more.map((x, j) => chip(x, 'mm' + j)).join('')}</div>` : ''}
          <div class="field"><label for="motto-input">Or finish it your way (up to ${room} letters)</label><input id="motto-input" maxlength="${room}" autocomplete="off" value="${esc(m.end)}" placeholder="e.g. ${m.start === 'Never' ? 'stop dreaming' : 'climb higher'}"></div>`;
      }
    } else if (q.type === 'name') {
      const sug = ANIMALS[picked].names;
      body = `<div class="chips" role="group" aria-label="Name ideas">${sug.map((w, j) => `<button type="button" class="chip" id="o${j}" data-v="${esc(w)}" aria-pressed="${st.name === w}">${esc(w)}</button>`).join('')}</div>
        <div class="field"><label for="name-input">Creature name (up to 16 characters)</label><input id="name-input" maxlength="16" autocomplete="off" value="${esc(st.name)}" placeholder="e.g. Captain Sprinkles"></div>`;
    } else {
      body = `<div class="opts" role="group" aria-label="Choices">${q.o.map((o, j) => `<button type="button" class="opt" id="o${j}" data-v="${o[0]}" aria-pressed="${st[q.k] === o[0]}"><span class="k">${L[j]}</span><span class="t"><b>${o[1]}</b><span>${o[2]}</span></span></button>`).join('')}</div>`;
    }
    h = `<div class="kicker">Question ${n} of 20 · Bring it to life</div>
      <h1>${q.q}</h1><p class="sub">${q.s}</p>${body}
      ${navHTML(n === 20 ? 'Finish my badge' : 'Next')}`;
    cap.textContent = 'Point at a choice to preview it. Click to keep it.';
  }
  panel.innerHTML = h;
  if (!quiet) { panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter'); }
  pips();
  wire();
  if (f === 'finish') makeOut(); else paint();
  const el = focus ? document.getElementById(focus) : null;
  if (el) el.focus();
}


const MOTTO_MAX = 26;
function mottoText(m) { return m && m.start && m.end.trim() ? `${m.start} ${m.end.trim()}`.toUpperCase() : ''; }
function mottoIdeas(start) {
  const blank = Q1[9], ab = st.a1[9], wy = Q1[0], wa = st.a1[0];
  const fit = list => [...new Set(list)].filter(x => x && start.length + 1 + x.length <= MOTTO_MAX);
  if (start === 'Never') {
    const mine = ab.b != null ? [blank.b[ab.b][2]] : [];
    return { mine: fit(mine), more: fit(blank.b.map(o => o[2])).filter(x => !mine.includes(x)) };
  }
  const mine = [];
  if (ab.a != null) mine.push(blank.a[ab.a][2]);
  wa.forEach((x, r) => { if (x != null) mine.push(wy.rounds[r][x][2]); });
  const m = fit(mine);
  return { mine: m, more: fit(ANIMALS[picked].mot).filter(x => !m.includes(x)) };
}
function readout(s, v) { return v === 2 ? 'Right in the middle' : (v === 0 || v === 4 ? 'All the way: ' : 'Leaning: ') + (v < 2 ? s[0] : s[1]); }
function q1Body(q, a) {
  const P = c => c ? 'true' : 'false';
  if (q.t === 'wyr' || q.t === 'word') {
    const n = q.rounds.length, r = ui.r, first = a.findIndex(x => x == null);
    const dots = `<div class="rounds" role="group" aria-label="Rounds">${q.rounds.map((_, k) => `<button type="button" class="rd ${a[k] != null ? 'got' : ''} ${k === r ? 'cur' : ''}" id="rd${k}" data-r="${k}" ${a[k] != null || k === first ? '' : 'disabled'} aria-label="Round ${k + 1}">${k + 1}</button>`).join('')}<span class="hint">Round ${r + 1} of ${n}</span></div>`;
    if (q.t === 'wyr') {
      const [A, B] = q.rounds[r];
      return dots + `<div class="duo">
        <button type="button" class="opt big" id="o0" data-x="0" aria-pressed="${P(a[r] === 0)}"><span class="t"><b>${A[0]}</b></span></button>
        <span class="or" aria-hidden="true">OR</span>
        <button type="button" class="opt big" id="o1" data-x="1" aria-pressed="${P(a[r] === 1)}"><span class="t"><b>${B[0]}</b></span></button></div>`;
    }
    const [word, opts] = q.rounds[r];
    return dots + `<div class="flash"><span>${word}</span>${a[r] == null ? '<div class="timer" aria-hidden="true"><i></i></div>' : ''}</div>
      <div class="chips wordchips" role="group" aria-label="Answers">${shuffleIdx(opts.length, r + 5).map((j, k) => `<button type="button" class="chip" id="o${k}" data-x="${j}" aria-pressed="${P(a[r] === j)}">${opts[j][0]}</button>`).join('')}</div>`;
  }
  if (q.t === 'scene') return `<div class="opts pics" role="group" aria-label="Pictures">${q.o.map((o, j) => `<button type="button" class="opt pic" id="o${j}" data-x="${j}" aria-pressed="${P(a === j)}">${ART[o[0]]}<span class="t"><b>${o[1]}</b></span></button>`).join('')}</div>`;
  if (q.t === 'slider') return `<div class="sliders">${q.s.map((s, j) => `<div class="sl"><div class="ends"><span>${s[0]}</span><span>${s[1]}</span></div><input type="range" id="sl${j}" data-s="${j}" min="0" max="4" step="1" value="${a[j]}" aria-label="${s[0]} or ${s[1]}"><div class="read" id="rd${j}">${readout(s, a[j])}</div></div>`).join('')}</div>`;
  if (q.t === 'pack') return `<div class="bag">${[0, 1, 2].map(k => `<span class="slot ${a[k] != null ? 'full' : ''}">${a[k] != null ? q.o[a[k]][0] : 'Empty slot'}</span>`).join('')}</div>
      <p class="hint" aria-live="polite">${ui.msg || (a.length === 3 ? 'Bag is full. Tap an item to take it out.' : `Pick ${3 - a.length} more.`)}</p>
      <div class="opts tiles" role="group" aria-label="Items">${q.o.map((o, j) => `<button type="button" class="opt" id="o${j}" data-x="${j}" aria-pressed="${P(a.includes(j))}"><span class="k">${L[j]}</span><span class="t"><b>${o[0]}</b></span></button>`).join('')}</div>`;
  if (q.t === 'whatif') {
    let h = `<div class="opts" role="group" aria-label="First move">${q.o.map((o, j) => `<button type="button" class="opt" id="o${j}" data-x="${j}" data-step="a" aria-pressed="${P(a.a === j)}"><span class="k">${L[j]}</span><span class="t"><b>${o[0]}</b></span></button>`).join('')}</div>`;
    if (a.a != null) h += `<div class="then"><h2>Nice. Then what?</h2><div class="opts" role="group" aria-label="Next move">${q.o[a.a][2].map((o, j) => `<button type="button" class="opt" id="p${j}" data-x="${j}" data-step="b" aria-pressed="${P(a.b === j)}"><span class="t"><b>${o[0]}</b></span></button>`).join('')}</div></div>`;
    return h;
  }
  if (q.t === 'shape') return `<div class="shapes" role="group" aria-label="Shapes">${q.o.map((o, j) => `<button type="button" class="opt shp" id="o${j}" data-x="${j}" aria-pressed="${P(a === j)}">${SHAPE[o[0]]}<b>${o[1]}</b></button>`).join('')}</div>${a != null ? `<div class="note">${q.o[a][3]}</div>` : ''}`;
  if (q.t === 'match') return `<div class="rows">${q.rows.map((r, ri) => `<div class="row"><div class="cue">${r[0]}</div><div class="chips" role="group" aria-label="${r[0]}">${r[1].map((o, j) => `<button type="button" class="chip" id="${ri === 0 ? 'o' + j : 'm' + ri + '-' + j}" data-r="${ri}" data-x="${j}" aria-pressed="${P(a[ri] === j)}">${o[0]}</button>`).join('')}</div></div>`).join('')}</div>`;
  if (q.t === 'alloc') {
    const left = 10 - a.reduce((t, x) => t + x, 0);
    return `<div class="left"><b>${left}</b> point${left === 1 ? '' : 's'} left</div>
      <div class="alloc">${q.o.map((o, j) => `<div class="al"><span class="nm">${o[0]}</span><button type="button" class="pm" id="pm${j}m" data-x="${j}" data-d="-1" ${a[j] === 0 ? 'disabled' : ''} aria-label="Take a point from ${o[0]}">−</button><span class="pdots">${Array.from({ length: 10 }, (_, k) => `<i class="${k < a[j] ? 'on' : ''}"></i>`).join('')}</span><button type="button" class="pm" id="pm${j}p" data-x="${j}" data-d="1" ${left === 0 ? 'disabled' : ''} aria-label="Add a point to ${o[0]}">+</button><em>${a[j]}</em></div>`).join('')}</div>`;
  }
  if (q.t === 'blank') {
    const g = (k, arr) => a[k] != null ? `<span class="fill">${arr[a[k]][0]}</span>` : '<span class="gap">______</span>';
    return `<div class="sentence">A great leader always ${g('a', q.a)} and never ${g('b', q.b)}.</div>
      <h2>Always…</h2><div class="chips" role="group" aria-label="Always">${q.a.map((o, j) => `<button type="button" class="chip" id="o${j}" data-k="a" data-x="${j}" aria-pressed="${P(a.a === j)}">${o[0]}</button>`).join('')}</div>
      <h2>And never…</h2><div class="chips" role="group" aria-label="Never">${q.b.map((o, j) => `<button type="button" class="chip" id="b${j}" data-k="b" data-x="${j}" aria-pressed="${P(a.b === j)}">${o[0]}</button>`).join('')}</div>`;
  }
  return '';
}

function finishHTML() {
  const A = ANIMALS[picked], nm = st.name.trim();
  const tips = {
    button: 'The colored ring wraps around the edge of the button.',
    sticker: 'Print on sticker paper and cut along the dotted line.',
    keychain: 'Print, laminate, and cut along the dotted line. Punch the small circle at the top for the ring.',
    cricut: 'Upload the saved picture to Cricut Design Space and choose Print Then Cut. The background is see-through, so the machine cuts around the white border. Keep it 6.75 inches wide or smaller.',
    shirt: 'Print on iron-on transfer paper, or upload it for heat-transfer vinyl or a shirt printer. The background is see-through, so only the badge goes on the shirt.'
  };
  cap.textContent = 'Right-click the picture and choose “Save image as” to keep it.';
  return `<div class="kicker">Your badge is ready</div>
    <h1>Meet ${esc(nm)}!</h1>
    <p class="sub">${esc(nm)} the ${A.n.toLowerCase()} lives by one motto: <b>\u201C${esc(st.motto.start + ' ' + st.motto.end.trim())}.\u201D</b> ${A.blurb}</p>
    <div class="facts">
      <div class="fact"><span>Leadership style</span><b>${A.style}</b></div>
      <div class="fact"><span>Dream job</span><b>${JOB[st.job]}</b></div>
      <div class="fact"><span>Strengths</span><b>${A.str.join(' · ')}</b></div>
      <div class="fact"><span>Free time</span><b>${SCENE[st.scene][0].toUpperCase() + SCENE[st.scene].slice(1)}</b></div>
    </div>
    <div class="note"><b>Growth edge:</b> ${A.edge}</div>
    <h2>Make it</h2>
    <div class="seg" role="group" aria-label="What are you making?">
      ${[['button', 'Button'], ['sticker', 'Sticker'], ['keychain', 'Keychain'], ['cricut', 'Cricut'], ['shirt', 'T-shirt']].map(([k, l]) => `<button type="button" class="chip" id="fmt-${k}" data-fmt="${k}" aria-pressed="${st.format === k}">${l}</button>`).join('')}
    </div>
    <label class="toggle"><input type="checkbox" id="mono" ${st.mono ? 'checked' : ''}> Black and white (saves color ink)</label>
    ${st.format === 'shirt' ? `<label class="toggle"><input type="checkbox" id="mirror" ${st.mirror ? 'checked' : ''}> Mirror it (needed for iron-on paper for light shirts)</label>` : ''}
    <p>${tips[st.format]}</p>
    <div class="note"><b>To print:</b> right-click your creature picture and choose <b>Save image as</b>. Then print the saved file.</div>
    <div class="nav"><button type="button" class="btn" id="back">Back</button><button type="button" class="btn go" id="again">Make another creature</button></div>`;
}

function makeOut() {
  const go = () => {
    const shirt = st.format === 'shirt';
    const out = compose(shirt ? 2400 : 1200, st.format, st.mono, shirt && st.mirror);
    outimg.src = out.toDataURL('image/png');
    const label = { button: 'button', sticker: 'sticker', keychain: 'keychain', cricut: 'Cricut Print Then Cut image', shirt: 'T-shirt transfer' }[st.format];
    outimg.alt = `${st.name.trim()} the ${ANIMALS[picked].n}, printable ${label}${shirt && st.mirror ? ' (mirrored)' : ''}`;
    outimg.hidden = false; cv.hidden = true;
  };
  document.fonts && document.fonts.ready ? document.fonts.ready.then(go) : go();
}

function go(d) {
  const f = FLOW[pos];
  hatchStart = null;
  if (d > 0 && f !== 'intro' && f !== 'finish' && f.p === 1 && f.i === 9) { picked = ranks().order[0]; if (!reduce) hatchStart = performance.now(); }
  if (d > 0 && f === 'intro') picked = null;
  pos = Math.max(0, Math.min(FLOW.length - 1, pos + d));
  ui = { r: 0, touched: false, msg: '' };
  const nf = FLOW[pos];
  if (typeof nf === 'object' && nf.p === 1) {
    const q = Q1[nf.i], a = st.a1[nf.i];
    if (q.rounds) { const fn = a.findIndex(x => x == null); ui.r = fn < 0 ? q.rounds.length - 1 : fn; }
    if (q.t === 'slider' && d < 0) ui.touched = true;
  }
  render('next');
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}


let advT;
function wireQ1(i) {
  const q = Q1[i], a = st.a1[i];
  const again = id => { render(id, true); };
  if (q.t === 'wyr' || q.t === 'word') {
    panel.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { clearTimeout(advT); ui.r = +b.dataset.r; again(b.id); });
    panel.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      a[ui.r] = +b.dataset.x; clearTimeout(advT); again(b.id);
      const fn = a.findIndex(x => x == null);
      advT = setTimeout(() => { if (fn >= 0) { ui.r = fn; again('o0'); } else again('next'); }, 420);
    });
    return;
  }
  if (q.t === 'slider') {
    panel.querySelectorAll('[data-s]').forEach(inp => inp.oninput = () => {
      const j = +inp.dataset.s; a[j] = +inp.value; ui.touched = true;
      document.getElementById('rd' + j).textContent = readout(q.s[j], a[j]);
      const n = document.getElementById('next'); if (n) n.disabled = !canNext(); paint();
    });
    return;
  }
  panel.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
    const x = +b.dataset.x;
    if (q.t === 'scene' || q.t === 'shape') st.a1[i] = x;
    else if (q.t === 'pack') {
      const k = a.indexOf(x); ui.msg = '';
      if (k >= 0) a.splice(k, 1); else if (a.length < 3) a.push(x); else ui.msg = 'Your bag is full. Tap something you packed to take it out first.';
    }
    else if (q.t === 'whatif') { if (b.dataset.step === 'a') { if (a.a !== x) { a.a = x; a.b = null; } again('p0'); paint(); return; } a.b = x; }
    else if (q.t === 'match') a[+b.dataset.r] = x;
    else if (q.t === 'alloc') { const left = 10 - a.reduce((t, v) => t + v, 0); const d = +b.dataset.d; if (d > 0 && left > 0) a[x]++; if (d < 0 && a[x] > 0) a[x]--; }
    else if (q.t === 'blank') a[b.dataset.k] = x;
    again(b.id); paint();
  });
}

function wire() {
  const f = FLOW[pos];
  const nx = document.getElementById('next'), bk = document.getElementById('back');
  if (nx) nx.onclick = () => { if (canNext()) go(1); };
  if (bk) bk.onclick = () => go(-1);
  const refreshNext = () => { const n = document.getElementById('next'); if (n) n.disabled = !canNext(); };
  const sk = document.getElementById('skiphatch');
  if (sk) { sk.onclick = () => { hatchStart = null; render('next'); }; return; }
  if (f === 'reveal') {
    document.getElementById('swap').onclick = () => {
      const r = ranks(); picked = picked === r.order[0] ? r.order[1] : r.order[0]; render('swap');
    };
    return;
  }
  if (f === 'finish') {
    panel.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => { st.format = b.dataset.fmt; render('fmt-' + st.format); });
    document.getElementById('mono').onchange = e => { st.mono = e.target.checked; makeOut(); };
    const mir = document.getElementById('mirror');
    if (mir) mir.onchange = e => { st.mirror = e.target.checked; makeOut(); };
    document.getElementById('again').onclick = () => { st = fresh(); picked = null; pos = 0; render('next'); };
    return;
  }
  if (f === 'intro') return;
  if (f.p === 1) { wireQ1(f.i); return; }
  const q = Q2[f.i];
  if (q.type === 'motto') {
    const m = st.motto;
    panel.querySelectorAll('[data-ms]').forEach(b => b.onclick = () => {
      if (m.start !== b.dataset.ms) { const was = m.start; m.start = b.dataset.ms; const room = MOTTO_MAX - m.start.length - 1; if (m.end.length > room || (was === 'Never') !== (m.start === 'Never')) m.end = ''; }
      render(b.id, true);
    });
    panel.querySelectorAll('[data-me]').forEach(b => b.onclick = () => { m.end = b.dataset.me; render(b.id, true); });
    const mi = document.getElementById('motto-input');
    if (mi) mi.oninput = () => {
      mi.value = mi.value.replace(/[^A-Za-z '!\-]/g, '');
      m.end = mi.value;
      const sent = panel.querySelector('.sentence');
      if (sent) sent.innerHTML = `<span class="fill">${m.start}</span> ${m.end.trim() ? `<span class="fill">${esc(m.end.trim())}</span>` : '<span class="gap">__________</span>'}`;
      panel.querySelectorAll('[data-me]').forEach(x => x.setAttribute('aria-pressed', x.dataset.me === m.end.trim()));
      refreshNext(); paint();
    };
    return;
  }
  panel.querySelectorAll('[data-v]').forEach(b => {
    b.onclick = () => {
      st[q.k] = b.dataset.v;
      panel.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
      const inp = document.getElementById('name-input');
      if (inp && q.k === 'name') inp.value = st.name;
      hover = null; refreshNext(); paint();
    };
    b.onmouseenter = () => { hover = { k: q.k, v: b.dataset.v }; paint(); };
    b.onmouseleave = () => { hover = null; paint(); };
  });
  const ni = document.getElementById('name-input');
  if (ni) ni.oninput = () => {
    ni.value = ni.value.replace(/[^A-Za-z0-9 .'\-]/g, '');
    st.name = ni.value;
    panel.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === st.name));
    refreshNext(); paint();
  };
}

document.addEventListener('keydown', e => {
  const f = FLOW[pos];
  const typing = e.target && e.target.tagName === 'INPUT' && e.target.type === 'text';
  if (e.key === 'Enter' && (typing || e.target === document.body)) {
    const n = document.getElementById('next'); if (n && !n.disabled) { e.preventDefault(); n.click(); }
    return;
  }
  if (typing || typeof f !== 'object') return;
  const idx = '12345678'.indexOf(e.key) >= 0 ? '12345678'.indexOf(e.key) : 'abcdefgh'.indexOf(e.key.toLowerCase());
  if (idx >= 0 && e.key.length === 1) { const b = document.getElementById('o' + idx); if (b) { b.click(); b.focus(); } }
});

const rs = document.getElementById('restart'); let armT;
rs.onclick = () => {
  if (!rs.classList.contains('armed')) { rs.classList.add('armed'); rs.textContent = 'Click again to start over'; armT = setTimeout(() => { rs.classList.remove('armed'); rs.textContent = 'Start over'; }, 3000); return; }
  clearTimeout(armT); rs.classList.remove('armed'); rs.textContent = 'Start over';
  st = fresh(); picked = null; pos = 0; render('next');
};

render();
requestAnimationFrame(loop);
if (document.fonts) document.fonts.ready.then(() => { if (FLOW[pos] === 'finish') makeOut(); else paint(); });
</script>
